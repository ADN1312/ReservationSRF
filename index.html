.jj-scene{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;background:linear-gradient(rgba(8,14,30,.78),rgba(8,14,30,.78) 60%,rgba(20,55,95,.9));animation:jjFond 10s ease-in-out forwards}
.jj-bateau{position:absolute;bottom:12%;left:0;width:min(70vw,460px);animation:jjVogue 10s linear forwards}
.jj-houle{animation:jjHoule 1.6s ease-in-out infinite alternate;transform-origin:50% 80%}
.jj-flamme{animation:jjFeu .35s ease-in-out infinite alternate;transform-origin:50% 100%}
.jj-flamme:nth-child(2){animation-duration:.5s}.jj-flamme:nth-child(3){animation-duration:.42s}
.jj-texte{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:min(90vw,40rem);text-align:center;font:italic 1.6rem/1.4 Georgia,serif;color:#fff;text-shadow:0 2px 8px #000,0 0 2px #000;opacity:0;animation:jjTexte 10s ease forwards}
@keyframes jjVogue{from{transform:translateX(-110%)}to{transform:translateX(110vw)}}
@keyframes jjHoule{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(6px)}}
@keyframes jjFeu{from{transform:scaleY(.85) skewX(-4deg)}to{transform:scaleY(1.15) skewX(4deg)}}
@keyframes jjTexte{0%,12%{opacity:0}22%,85%{opacity:1}100%{opacity:0}}
@keyframes jjFond{0%{opacity:0}8%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.jj-bateau{left:50%;transform:translateX(-50%)}.jj-texte,.jj-scene{opacity:1}}

  .jj{position:static;margin:1.5rem 0 .5rem;max-width:none}.jj-plaque{position:static;width:auto;margin-top:.5rem}.jj-btn{font-size:.68rem}
}
</style>

<script>
'use strict';
/* ====================== CONFIGURATION ====================== */
const CONFIG = {
  PROXY_URL: 'https://steep-frost-cb5e.pnjst9nf55.workers.dev',   // relais Cloudflare : il détient le jeton Airtable
  AIRTABLE_BASE: 'appKZpxOpugzYhRTV',
  EMAILJS_PUBLIC_KEY: 'qrm4ufE6HldEP1WhC',
  EMAILJS_SERVICE: 'réservation',
  TEMPLATE_NOTIFICATION: 'template_1wihay6'    // seul modèle utilisé, pour tous les e-mails. Variables : sujet, message, to_email
};

/* ====================== OUTILS ====================== */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function normTime(t){ const m = String(t||'').trim().match(/^(\d{1,2})\s*(?:[:hH]\s*(\d{2})?)?$/); return m ? `${pad(+m[1])}:${m[2]||'00'}` : String(t||'').trim(); }
function fmtDate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(/ 1 /, ' 1er '); }
const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
const fmtH = t => { const [h, m] = t.split(':'); return `${+h} h${m === '00' ? '' : ' ' + m}`; };   // « 09:00 » devient « 9 h »
const plage = s => `${fmtH(s.debut)} à ${fmtH(s.fin)}`;
function fmtShort(iso){ const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
const cmpSlot = (a,b) => (a.date+a.debut).localeCompare(b.date+b.debut);
const plural = (n, s, p) => n > 1 ? p : s;
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch{ return ''; } },
  set(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch{} }
};
function announce(t){ const l = document.getElementById('live'); l.textContent = ''; setTimeout(() => l.textContent = t, 50); }
function show(html){
  app.innerHTML = html; window.scrollTo(0,0);
  const h = app.querySelector('h2'); if(!h) return; h.tabIndex = -1; h.focus({preventScroll:true});
  setTimeout(() => { if(h.isConnected && document.activeElement !== h) h.focus({preventScroll:true}); }, 120);   // 2e essai pour les lecteurs d'écran mobiles
}
const card = h => `<section class="card">${h}</section>`;
const msg = (t, x) => x ? `<p class="msg ${t}">${esc(x)}</p>` : '';
const loading = (t='Un instant…') => { app.innerHTML = card(`<p>${esc(t)}</p>`); announce(t); };
/* Erreur dans un formulaire : message en haut, saisie conservée, curseur placé sur le champ fautif. */
function fieldError(form, id, m){
  form.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
  let p = form.querySelector('.msg.err'); if(!p){ p = document.createElement('p'); p.className = 'msg err'; form.prepend(p); }
  p.textContent = m; SON.err(); const el = document.getElementById(id);
  if(el){ el.setAttribute('aria-invalid', 'true'); el.focus(); }
  announce(m);
}
const btn = (act, label, cls='', extra='') => `<button type="button" class="btn ${cls}" data-act="${act}" ${extra}>${label}</button>`;

/* ====================== AIRTABLE ====================== */
const API = CONFIG.PROXY_URL + '/v0';
const BASE = CONFIG.AIRTABLE_BASE;
async function at(path, opt = {}){
  const r = await fetch(API + path, {...opt, headers: opt.body ? {'Content-Type': 'application/json'} : {}});
  let data = null; try{ data = await r.json(); }catch{}
  if(!r.ok){ const e = new Error(data?.error?.message || ('Erreur ' + r.status)); e.status = r.status; e.kind = data?.error?.type; throw e; }
  return data;
}

/* Les noms de tables et de colonnes sont lus dans Airtable : majuscules, accents, tirets bas ou espaces n'ont pas d'importance. */
const DEF = {
  reservations:{label:'Réservations', names:['reservation','reservations'], needed:['nom','prenom','email','date','debut','fin','statut','token'], fields:{
    nom:['nom','name'], prenom:['prenom'], email:['email','mail','adressemail','adresseemail','courriel'], date:['date'],
    debut:['creneaudebut','heuredebut','debut'], fin:['creneaufin','heurefin','fin'], statut:['statut','status'],
    token:['tokenannulation','token'], datereservation:['datereservation','datedereservation']}},
  creneaux:{label:'Créneaux', names:['creneaux','creneau'], needed:['date','debut','fin','capacite'], fields:{
    date:['date'], debut:['heuredebut','debut','creneaudebut'], fin:['heurefin','fin','creneaufin'],
    capacite:['capacitemax','capacite','places','nombredeplaces'], actif:['actif']}},
  administrateurs:{label:'Administrateurs', names:['administrateurs','administrateur','admins'], needed:['nom','prenom','email','pin'], fields:{
    nom:['nom','name'], prenom:['prenom'], email:['email','mail','adressemail','adresseemail','courriel'], pin:['pin','codepin','code'], actif:['actif']}},
  journal:{label:'Journal', names:['journal','log'], needed:['admin','action'], fields:{
    admin:['administrateur','admin'], action:['action'], details:['details','detail']}},
  fermetures:{label:'Fermetures', names:['fermetures','fermeture'], needed:['date','journee'], fields:{
    date:['date'], debut:['heuredebut','debut'], fin:['heurefin','fin'], journee:['toutelajournee','journeeentiere','journee'],
    motif:['motif'], creepar:['creepar','par']}},
  parametres:{label:'Paramètres', optional:true, names:['parametres','parametre','reglages'], needed:['cle','valeur'], fields:{
    cle:['cle','key'], valeur:['valeur','value']}}
};
let SCHEMA = {};
async function loadSchema(){
  const d = await at(`/meta/bases/${BASE}/tables`);
  SCHEMA = {};
  for(const [key, def] of Object.entries(DEF)){
    const t = d.tables.find(t => def.names.includes(norm(t.name)));
    const s = SCHEMA[key] = {label: def.label, optional: !!def.optional, id: t?.id, realName: t?.name, fields: {}, absent: [], missingTable: !t};
    if(!t){ s.absent = def.needed.slice(); continue; }
    for(const [lk, cands] of Object.entries(def.fields)){
      let found = null;
      for(const c of cands){ found = t.fields.find(f => norm(f.name) === c); if(found) break; }
      if(found) s.fields[lk] = found.name;
    }
    s.absent = def.needed.filter(k => !s.fields[k]);
  }
}

const toReal = (key, f) => { const o = {}; for(const [k,v] of Object.entries(f)){ const n = SCHEMA[key].fields[k]; if(n && v !== undefined) o[n] = v; } return o; };
const gf = (rec, key, k) => rec.fields[SCHEMA[key].fields[k]];
async function listAll(key){
  let out = [], off;
  do{
    const d = await at(`/${BASE}/${SCHEMA[key].id}?pageSize=100` + (off ? `&offset=${encodeURIComponent(off)}` : ''));
    out = out.concat(d.records); off = d.offset;
  }while(off);
  return out;
}
async function createRecs(key, list){
  const res = [];
  for(let i = 0; i < list.length; i += 10){
    const records = list.slice(i, i+10).map(f => ({fields: toReal(key, f)}));
    res.push(...(await at(`/${BASE}/${SCHEMA[key].id}`, {method:'POST', body: JSON.stringify({records, typecast:true})})).records);
  }
  return res;
}
async function updateRecs(key, list){
  for(let i = 0; i < list.length; i += 10){
    const records = list.slice(i, i+10).map(x => ({id: x.id, fields: toReal(key, x.f)}));
    await at(`/${BASE}/${SCHEMA[key].id}`, {method:'PATCH', body: JSON.stringify({records, typecast:true})});
  }
}
async function deleteRecs(key, ids){
  for(let i = 0; i < ids.length; i += 10){
    const q = ids.slice(i, i+10).map(id => 'records[]=' + encodeURIComponent(id)).join('&');
    await at(`/${BASE}/${SCHEMA[key].id}?${q}`, {method:'DELETE'});
  }
}

/* ====================== MODÈLE ====================== */
function parseResa(r){
  const f = k => gf(r,'reservations',k);
  const raw = f('statut');
  return {id:r.id, nom:f('nom')||'', prenom:f('prenom')||'', email:String(f('email')||'').trim(), date:String(f('date')||'').slice(0,10),
    debut:normTime(f('debut')), fin:normTime(f('fin')), statutRaw: raw || 'Confirmée', ok: !raw || norm(raw) === 'confirmee', token:f('token')||''};
}
function parseSlot(r){
  const f = k => gf(r,'creneaux',k);
  return {id:r.id, date:String(f('date')||'').slice(0,10), debut:normTime(f('debut')), fin:normTime(f('fin')), cap:Number(f('capacite'))||0,
    actif: SCHEMA.creneaux.fields.actif ? !!f('actif') : true};
}
function parseFerm(r){
  const f = k => gf(r,'fermetures',k);
  return {id:r.id, date:String(f('date')||'').slice(0,10), debut:normTime(f('debut')), fin:normTime(f('fin')), journee:!!f('journee')};
}
function parseAdmin(r){
  const f = k => gf(r,'administrateurs',k);
  const a = {id:r.id, nom:f('nom')||'', prenom:f('prenom')||'', email:String(f('email')||'').trim(), pin:String(f('pin')||''),
    actif: SCHEMA.administrateurs.fields.actif ? !!f('actif') : true};
  a.full = `${a.prenom} ${a.nom}`.trim();
  return a;
}
const closedBy = (s, ferms) => ferms.some(x => x.date === s.date && (x.journee || (x.debut && x.fin && s.debut >= x.debut && s.fin <= x.fin)));
async function loadPlanning(){
  const [c, r, f] = await Promise.all([listAll('creneaux'), listAll('reservations'), listAll('fermetures')]);
  const resas = r.map(parseResa).filter(x => x.ok);
  const ferms = f.map(parseFerm);
  const slots = c.map(parseSlot).filter(s => s.date && s.debut && s.fin && s.actif).map(s => {
    s.people = resas.filter(x => x.date === s.date && x.debut === s.debut && x.fin === s.fin);
    s.taken = s.people.length; s.left = Math.max(0, s.cap - s.taken);
    s.full = s.taken >= s.cap; s.closed = closedBy(s, ferms); return s;
  }).sort(cmpSlot);
  return {slots, resas, ferms};
}
const upcoming = slots => { const t = todayISO(), n = nowHM(); return slots.filter(s => s.date > t || (s.date === t && s.debut > n)); };
const loadAdmins = async () => (await listAll('administrateurs')).map(parseAdmin).filter(a => a.actif);

/* ====================== CODES PIN ====================== */
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('resa-sref|' + pin));
  return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function pinMatches(stored, pin){ return !stored ? false : stored.startsWith('sha256:') ? stored === await hashPin(pin) : stored === pin; }

/* Remplace les repères entre crochets ; majuscules et accents sont tolérés ([Prenom] = [prénom]). */
function fill(text, vars){
  const v = {}; for(const [k, x] of Object.entries(vars)) v[norm(k)] = x;
  return text.replace(/\[([^\]]+)\]/g, (m, k) => v[norm(k)] ?? m);
}
async function loadParams(){
  S.params = {}; S.paramIds = {};
  if(!SCHEMA.parametres?.id || SCHEMA.parametres.absent.length) return;
  for(const r of await listAll('parametres')){ const k = gf(r,'parametres','cle'); if(k){ S.params[k] = gf(r,'parametres','valeur') ?? ''; S.paramIds[k] = r.id; } }
}
async function saveParams(obj){
  const upd = [], add = [];
  for(const [cle, valeur] of Object.entries(obj)) S.paramIds[cle] ? upd.push({id:S.paramIds[cle], f:{valeur}}) : add.push({cle, valeur});
  if(upd.length) await updateRecs('parametres', upd);
  if(add.length) await createRecs('parametres', add);
  await loadParams();
}
const param = (k, def) => (S.params[k] ?? '') !== '' ? S.params[k] : def;
const tpl = k => ({sujet: param(`mail.${k}.sujet`, MAILS[k].sujet), corps: param(`mail.${k}.corps`, MAILS[k].corps)});
const parametresOk = () => !!SCHEMA.parametres?.id && !SCHEMA.parametres.absent.length;
const notifOn = (adminId, type) => param(`notif.${type}.${adminId}`, 'oui') !== 'non';

const send = (to, sujet, message) => mail(CONFIG.TEMPLATE_NOTIFICATION, {to_email:to, sujet, message, from_name: param('expediteur', EXPEDITEUR)});
/* Envoie le modèle « k » à une personne, en remplaçant les repères. */
const mailUser = (to, k, vars, corps) => { const t = tpl(k); return send(to, fill(t.sujet, vars), fill(corps ?? t.corps, vars)); };
/* Prévient les administrateurs. type : 'resa', 'annul', ou null (tous). sauf : l'administrateur à l'origine de l'action, inutile de le prévenir. */
async function mailAdmins(k, vars, type, sauf){
  await loadParams().catch(() => {});
  const to = (await loadAdmins()).filter(a => a.id !== sauf && (!type || notifOn(a.id, type))).map(a => a.email).filter(Boolean);
  if(!to.length) return {ok:true};
  const t = tpl(k), sujet = fill(t.sujet, vars), message = fill(t.corps, vars);
  const r = await send(to.join(','), sujet, message);
  if(r.ok || to.length === 1 || ![400,422].includes(r.status)) return r;
  let ok = false; for(const x of to){ if((await send(x, sujet, message)).ok) ok = true; }
  return {ok};
}

  if(!found){ await new Promise(r => setTimeout(r, 800)); return renderLogin(admins, 'Code PIN incorrect.'); }

async function newAdminRecord(fd, admins){
  const o = {prenom: fd.get('prenom').trim(), nom: fd.get('nom').trim(), email: fd.get('email').trim(), pin: fd.get('pin').trim()};
  if(!o.prenom) return {err:'Renseignez le prénom.', field:'a-prenom'};
  if(!o.nom) return {err:'Renseignez le nom.', field:'a-nom'};
  if(!emailOk(o.email)) return {err:'L\'adresse e-mail n\'est pas valide.', field:'a-email'};
  if(!/^\d{4}$/.test(o.pin)) return {err:'Le code PIN doit comporter exactement 4 chiffres.', field:'a-pin'};
  for(const a of admins) if(await pinMatches(a.pin, o.pin)) return {err:'Ce code PIN est déjà utilisé par un autre administrateur. Choisissez-en un autre.', field:'a-pin'};
  const h = await hashPin(o.pin);
  const [rec] = await createRecs('administrateurs', [{nom:o.nom, prenom:o.prenom, email:o.email, pin:h, actif:true}]);
  return {admin: parseAdmin(rec), o};
}

function renderFermImpact(err){
  const f = S.ferm, n = new Set(f.impact.map(r => r.email.toLowerCase())).size;
  shell('fermeture', `<p>Étape 2 sur 3 : vérifier l'impact et le message.</p>${msg('err', err)}
    <p><strong>${n} ${plural(n,'personne sera notifiée','personnes seront notifiées')}</strong> et ${f.impact.length} ${plural(f.impact.length,'réservation sera annulée','réservations seront annulées')}.</p>
    ${f.impact.length ? `<div class="defile" role="region" aria-label="Personnes concernées" tabindex="0"><table><caption>Personnes concernées</caption><thead><tr><th scope="col">Nom</th><th scope="col">E-mail</th><th scope="col">Créneau</th></tr></thead><tbody>${f.impact.map(r => `<tr><td>${esc(r.prenom)} ${esc(r.nom)}</td><td>${esc(r.email)}</td><td>${plage(r)}</td></tr>`).join('')}</tbody></table></div>` : ''}

    <div class="actions">${btn('f-back','Retour','sec')}<button class="btn danger gros" type="submit">${n ? 'Envoyer les notifications' : 'Enregistrer la fermeture'}</button></div></form>`);

}
A['f-back'] = () => renderFermSlots();
A['f-send'] = async fd => {
  const f = S.ferm, message = fd.get('message').trim(); if(!message) return renderFermImpact('Le message ne peut pas être vide.');
  loading('Envoi en cours, ne fermez pas la page…');
  const rows = f.all ? [{date:f.date, journee:true, motif:message, creepar:S.admin.full}]
    : f.chosen.map(s => ({date:f.date, debut:s.debut, fin:s.fin, journee:false, motif:message, creepar:S.admin.full}));
  await createRecs('fermetures', rows);
  if(f.impact.length) await updateRecs('reservations', f.impact.map(r => ({id:r.id, f:{statut:'Annulée'}})));
  const byMail = {}; f.impact.forEach(r => (byMail[r.email.toLowerCase()] ||= {r, slots:[]}).slots.push(plage(r)));
  let sent = 0; const failed = [];
  for(const [email, g] of Object.entries(byMail)){
    const m = await mailUser(g.r.email, 'fermeture', {prenom:g.r.prenom, nom:g.r.nom, date:fmtDate(f.date), horaires:f.horaires, heure:g.slots.join(', ')}, message);
    m.ok ? sent++ : failed.push(g.r.email);
  }
  const n = Object.keys(byMail).length;
  await mailAdmins('adminFerm', {administrateur:S.admin.full, date:fmtDate(f.date), horaires:f.horaires, nombre:String(f.impact.length)}, null, S.admin.id);
  await logAction('Fermeture exceptionnelle', `${fmtShort(f.date)} ${f.all ? 'toute la journée' : f.chosen.map(s => s.debut + '-' + s.fin).join(', ')} : ${f.impact.length} réservations annulées, ${sent} e-mails envoyés`);
  S.ferm = null;
  SON.annul();
  shell('fermeture', `<p class="msg ${failed.length ? 'err' : 'ok'}">Fermeture enregistrée : ${f.impact.length} ${plural(f.impact.length,'réservation annulée','réservations annulées')}, ${sent} sur ${n} ${plural(n,'e-mail envoyé','e-mails envoyés')}.</p>
    ${failed.length ? `<p>E-mails non envoyés (à prévenir autrement) : ${failed.map(esc).join(', ')}</p>` : ''}<div class="actions">${btn('tab','Retour au planning','',`data-tab="planning"`)}</div>`);
  announce(`Fermeture enregistrée. ${sent} e-mails envoyés sur ${n}.`);
};

async function tabReglages(){

    <p>En attendant, les e-mails utilisent les textes d'origine et tous les administrateurs reçoivent les notifications.</p>`;
  await loadParams(); const id = S.admin.id;
  const coche = t => notifOn(id, t) ? 'checked' : '';
  return `<form data-form="rg-notif"><h3>Mes notifications</h3><p>Ce réglage ne concerne que vous (${esc(S.admin.full)}).</p>
    <div class="rappel"><input type="checkbox" id="rg-resa" name="resa" ${coche('resa')}><label for="rg-resa">Recevoir un e-mail à chaque réservation</label></div>
    <div class="rappel"><input type="checkbox" id="rg-annul" name="annul" ${coche('annul')}><label for="rg-annul">Recevoir un e-mail à chaque annulation</label></div>
    <p class="aide">Les fermetures exceptionnelles sont toujours signalées à tous les administrateurs.</p>
    <div class="actions"><button class="btn" type="submit">Enregistrer mes notifications</button></div></form>
    <p class="msg info">Bon à savoir : la formule gratuite d'EmailJS permet 200 e-mails par mois, tous types confondus. Chaque réservation ou annulation en utilise 2 (un pour la personne, un pour les administrateurs). Au-delà d'environ 100 réservations et annulations par mois, pensez à décocher les notifications d'annulation pour économiser des envois.</p>
    <form data-form="rg-mails" novalidate><h3>Les e-mails envoyés</h3><p>Ces textes sont communs à tous les administrateurs. Les repères entre crochets, comme [prénom], sont remplacés automatiquement.</p>
    <div class="champ"><label for="rg-exp">Nom de l'expéditeur</label><input id="rg-exp" name="expediteur" type="text" spellcheck="false" value="${esc(param('expediteur', EXPEDITEUR))}"></div>
    ${Object.entries(MAILS).map(([k, m]) => { const t = tpl(k); return `<fieldset class="rg-mail"><legend>${esc(m.titre)}</legend>
      <p class="aide">Envoyé à ${esc(m.pour)}. Repères : ${m.reperes.map(x => '[' + esc(x) + ']').join(', ')}.</p>
      <div class="champ"><label for="rg-${k}-s">Objet</label><input id="rg-${k}-s" name="${k}.sujet" type="text" value="${esc(t.sujet)}"></div>
      <div class="champ"><label for="rg-${k}-c">Texte</label><textarea id="rg-${k}-c" name="${k}.corps" rows="7">${esc(t.corps)}</textarea></div>
      ${btn('rg-reset', 'Rétablir le texte d\'origine', 'sec', `data-k="${k}" aria-label="Rétablir le texte d'origine : ${esc(m.titre)}"`)}</fieldset>`; }).join('')}
    <div class="actions"><button class="btn" type="submit">Enregistrer les e-mails</button></div></form>`;
}
A['rg-notif'] = async fd => {
  loading();
  await saveParams({[`notif.resa.${S.admin.id}`]: fd.get('resa') ? 'oui' : 'non', [`notif.annul.${S.admin.id}`]: fd.get('annul') ? 'oui' : 'non'});
  await logAction('Réglage des notifications', `Réservations : ${fd.get('resa') ? 'oui' : 'non'}, annulations : ${fd.get('annul') ? 'oui' : 'non'}`);
  adminTab('reglages', {m:'Vos notifications sont enregistrées.'});
};
A['rg-mails'] = async (fd, form) => {
  const vals = {expediteur: fd.get('expediteur').trim()};
  if(!vals.expediteur) return fieldError(form, 'rg-exp', 'Le nom de l\'expéditeur ne peut pas être vide.');
  for(const k of Object.keys(MAILS)){
    const sj = fd.get(`${k}.sujet`).trim(), co = fd.get(`${k}.corps`).trim();
    if(!sj) return fieldError(form, `rg-${k}-s`, `L'objet « ${MAILS[k].titre} » ne peut pas être vide.`);
    if(!co) return fieldError(form, `rg-${k}-c`, `Le texte « ${MAILS[k].titre} » ne peut pas être vide.`);
    vals[`mail.${k}.sujet`] = sj; vals[`mail.${k}.corps`] = co;
  }
  if(!/\[lien d.annulation\]/i.test(vals['mail.confirmation.corps']) && !confirm('Le texte de confirmation ne contient plus [lien d\'annulation] : les personnes ne pourront plus annuler depuis l\'e-mail. Enregistrer quand même ?')) return;
  loading(); await saveParams(vals);
  await logAction('Modification des e-mails', 'Textes et expéditeur enregistrés');
  adminTab('reglages', {m:'Les e-mails sont enregistrés.'});
};
A['rg-reset'] = d => {
  const m = MAILS[d.k]; document.getElementById(`rg-${d.k}-s`).value = m.sujet; document.getElementById(`rg-${d.k}-c`).value = m.corps;
  announce(`Texte d'origine rétabli pour « ${m.titre} ». Pensez à enregistrer.`);
};

/* ----- Journal ----- */
async function tabJournal(){
  const recs = (await listAll('journal')).sort((a,b) => b.createdTime.localeCompare(a.createdTime)).slice(0, 100);
  if(!recs.length) return '<p>Aucune action enregistrée.</p>';
  return `<ul class="liste journal">${recs.map(r => `<li><strong>${esc(gf(r,'journal','admin'))}</strong> : ${esc(gf(r,'journal','action'))}
    <small>${esc(new Date(r.createdTime).toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'}))}${gf(r,'journal','details') ? ' · ' + esc(gf(r,'journal','details')) : ''}</small></li>`).join('')}</ul>`;
}

/* ----- Export Excel ----- */
function tabExport(){
  return `<form data-form="exp" novalidate><div class="champ"><label for="e-p">Période</label><select id="e-p" name="p"><option value="semaine">La semaine</option><option value="mois" selected>Le mois</option><option value="annee">L'année</option></select></div>
    <div class="champ"><label for="e-d">Contenant la date du</label><input id="e-d" name="d" type="date" value="${todayISO()}" required></div>
    <div class="actions"><button class="btn" type="submit">Télécharger le fichier Excel</button></div></form>`;
}
function rangeOf(p, iso){
  const [y,m,d] = iso.split('-').map(Number), ref = new Date(y,m-1,d);
  if(p === 'semaine'){ const lun = new Date(ref); lun.setDate(ref.getDate() - ((ref.getDay()+6)%7)); const dim = new Date(lun); dim.setDate(lun.getDate()+6); return [isoOf(lun), isoOf(dim)]; }
  if(p === 'mois') return [isoOf(new Date(y,m-1,1)), isoOf(new Date(y,m,0))];
  return [`${y}-01-01`, `${y}-12-31`];
}
A.exp = async fd => {
  const p = fd.get('p'), d = fd.get('d'); if(!d) return adminTab('export', {t:'err', m:'Choisissez une date.'});
  loading('Préparation du fichier…');
  const [a, b] = rangeOf(p, d);
  const rows = (await listAll('reservations')).map(parseResa).filter(r => r.date >= a && r.date <= b).sort(cmpSlot);
  if(!rows.length) return adminTab('export', {t:'info', m:`Aucune réservation du ${fmtShort(a)} au ${fmtShort(b)}.`});
  if(typeof XLSX === 'undefined') return adminTab('export', {t:'err', m:'La bibliothèque Excel n\'a pas pu être chargée. Vérifiez la connexion internet.'});
  const data = rows.map(r => ({'Date':fmtShort(r.date), 'Début':r.debut, 'Fin':r.fin, 'Nom':r.nom, 'Prénom':r.prenom, 'E-mail':r.email, 'Statut':r.statutRaw}));
  const ws = XLSX.utils.json_to_sheet(data); ws['!cols'] = [12,8,8,20,20,32,12].map(wch => ({wch}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Réservations');
  XLSX.writeFile(wb, `resa-sref-${p}-${a}.xlsx`);
  await logAction('Export Excel', `${fmtShort(a)} au ${fmtShort(b)}, ${rows.length} lignes`);
  adminTab('export', {m:`Fichier téléchargé : ${rows.length} ${plural(rows.length,'réservation','réservations')} du ${fmtShort(a)} au ${fmtShort(b)}.`});
};

/* ====================== JEAN-JACQUES ======================
   Œuf de Pâques réservé à l'espace administrateur.
   La plaque dévoile un indice ; le mot « jeanjacques » tapé hors d'un champ lance la cérémonie. */
const JJ = {
  PHRASE: 'Jean-Jacques ne courait pas après la gloire : il l\'attendait sur sa branche. Elle est venue en drakkar.',
  PLAQUE: 'Ici reposait Jean-Jacques, phasme. Il ne faisait rien, mais il le faisait avec une distinction qui force le respect.',
  INDICE: 'Paraît qu\'il répond encore quand on l\'appelle par son nom. Encore faut-il savoir taper.',
  tape: '', enCours: false,
  plaque(){
    return `<div class="jj"><button type="button" class="jj-btn" data-act="jj" aria-expanded="false" aria-controls="jj-plaque">En mémoire de Jean-Jacques</button>
      <div id="jj-plaque" class="jj-plaque" hidden><p>${esc(this.PLAQUE)}</p><p class="jj-indice">${esc(this.INDICE)}</p></div></div>`;
  },
  scene(){
    const flammes = [[100,58,40],[125,40,58],[150,50,48],[178,34,64],[205,48,50],[232,56,42],[255,64,34]].map(([x,y,h]) =>
      `<path class="jj-flamme" d="M${x-9} ${y+h} Q${x-11} ${y+h/2} ${x} ${y} Q${x+11} ${y+h/2} ${x+9} ${y+h} Z" fill="#ff7a12" stroke="#ffd23f" stroke-width="3"/>`).join('');
    return `<div class="jj-scene"><svg class="jj-bateau" viewBox="0 0 340 170" aria-hidden="true"><g class="jj-houle">
      <rect x="166" y="14" width="5" height="90" fill="#5a3a1c"/>
      <path d="M171 18 L232 30 L232 88 L171 96 Z" fill="#c8102e"/><path d="M171 40 L232 46 M171 62 L232 64 M171 84 L232 82" stroke="#f3e9d2" stroke-width="7"/>
      ${flammes}
      <g stroke="#8fbf3a" stroke-width="4" stroke-linecap="round" fill="none"><path d="M110 92 L200 92"/><path d="M200 92 L214 80"/><path d="M122 92 L112 80 M140 92 L136 78 M160 92 L166 78 M180 92 L188 80 M128 92 L120 99 M172 92 L180 99"/><path d="M214 80 L232 68 M214 80 L236 76"/></g>
      <path d="M20 96 Q40 92 60 100 L280 100 Q300 92 322 96 Q300 140 250 146 L90 146 Q40 140 20 96 Z" fill="#7a4a22" stroke="#4a2c12" stroke-width="3"/>
      <path d="M20 96 Q8 80 14 62 Q24 70 30 90 Z M322 96 Q334 80 328 62 Q318 70 312 90 Z" fill="#7a4a22" stroke="#4a2c12" stroke-width="3"/>
      ${[70,110,150,190,230,270].map(x => `<circle cx="${x}" cy="114" r="10" fill="#d9b44a" stroke="#4a2c12" stroke-width="2"/>`).join('')}
      <path d="M0 150 Q42 138 85 150 T170 150 T255 150 T340 150 L340 170 L0 170 Z" fill="#2c5f8a" opacity=".9"/></g></svg>
      <p class="jj-texte">${esc(this.PHRASE)}</p></div>`;
  },
  son(){
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ac = new AC(), t0 = ac.currentTime, D = 10;
    const sortie = ac.createGain(); sortie.gain.setValueAtTime(0, t0); sortie.gain.linearRampToValueAtTime(.6, t0 + .8);
    sortie.gain.setValueAtTime(.6, t0 + D - 1.5); sortie.gain.linearRampToValueAtTime(0, t0 + D); sortie.connect(ac.destination);
    const bruit = ac.createBuffer(1, ac.sampleRate * D, ac.sampleRate), b = bruit.getChannelData(0);
    for(let i = 0; i < b.length; i++) b[i] = Math.random() * 2 - 1;
    // Vagues : bruit grave dont le volume monte et descend lentement
    const vague = ac.createBufferSource(); vague.buffer = bruit;
    const filtreV = ac.createBiquadFilter(); filtreV.type = 'lowpass'; filtreV.frequency.value = 500;
    const gV = ac.createGain(); gV.gain.value = .25; const lfo = ac.createOscillator(); lfo.frequency.value = .18;
    const gL = ac.createGain(); gL.gain.value = .2; lfo.connect(gL).connect(gV.gain);
    vague.connect(filtreV).connect(gV).connect(sortie); vague.start(t0); lfo.start(t0); vague.stop(t0 + D); lfo.stop(t0 + D);
    // Feu : petits craquements aigus au hasard
    const feu = ac.createBufferSource(); feu.buffer = bruit; const filtreF = ac.createBiquadFilter(); filtreF.type = 'highpass'; filtreF.frequency.value = 2500;
    const gF = ac.createGain(); gF.gain.setValueAtTime(0, t0);
    for(let t = .5; t < D - .5; t += .05 + Math.random() * .25){ gF.gain.setValueAtTime(.35 * Math.random(), t0 + t); gF.gain.setValueAtTime(0, t0 + t + .015); }
    feu.connect(filtreF).connect(gF).connect(sortie); feu.start(t0); feu.stop(t0 + D);
    // Cor viking : deux longues notes graves, en quinte
    [[1, 2.2], [3.8, 3.2]].forEach(([debut, duree]) => {
      const gC = ac.createGain(), filtreC = ac.createBiquadFilter(); filtreC.type = 'lowpass'; filtreC.frequency.value = 900;
      gC.gain.setValueAtTime(0, t0 + debut); gC.gain.linearRampToValueAtTime(.22, t0 + debut + .35);
      gC.gain.setValueAtTime(.22, t0 + debut + duree - .5); gC.gain.linearRampToValueAtTime(0, t0 + debut + duree);
      filtreC.connect(gC).connect(sortie);
      [98, 147].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f * .94, t0 + debut); o.frequency.linearRampToValueAtTime(f, t0 + debut + .3);
        o.connect(filtreC); o.start(t0 + debut); o.stop(t0 + debut + duree); });
    });
    setTimeout(() => ac.close(), (D + .5) * 1000);
  },
  ceremonie(){
    if(this.enCours) return; this.enCours = true;
    document.body.insertAdjacentHTML('beforeend', this.scene());
    try{ this.son(); }catch{}
    setTimeout(() => announce(this.PHRASE), 1200);
    setTimeout(() => { document.querySelector('.jj-scene')?.remove(); this.enCours = false; }, 10200);
  }
};
A.jj = (d, el) => {
  const p = document.getElementById('jj-plaque'), ouvert = p.hidden;
  p.hidden = !ouvert; el.setAttribute('aria-expanded', String(ouvert));
  if(ouvert) announce(`${JJ.PLAQUE} ${JJ.INDICE}`);
};
document.addEventListener('keydown', e => {
  if(!S.admin || e.ctrlKey || e.altKey || e.metaKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
  if(e.key.length !== 1) return;
  JJ.tape = (JJ.tape + e.key.toLowerCase()).replace(/[^a-z]/g, '').slice(-11);
  if(JJ.tape === 'jeanjacques'){ JJ.tape = ''; JJ.ceremonie(); }
});

/* ====================== SONS DISCRETS ======================
   Synthétisés par le navigateur, sans fichier. Un bouton « Sons » dans l'en-tête les coupe ou les remet ; le choix est mémorisé. */
const SON = {
  actif: (() => { try{ return localStorage.getItem('resa-sons') !== 'non'; }catch{ return true; } })(),
  ac: null,
  ctx(){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
    if(!this.ac) this.ac = new AC(); if(this.ac.state === 'suspended') this.ac.resume(); return this.ac; },
  note(f, debut, duree, vol = .12, type = 'sine'){
    const ac = this.ctx(); if(!ac) return; const t = ac.currentTime + debut;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + duree);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + duree + .05);
  },
  jouer(fn){ if(!this.actif) return; try{ fn(); }catch{} },
  ok(){ this.jouer(() => { this.note(1046.5, 0, .5, .09); this.note(1318.5, .09, .6, .08); this.note(1568, .18, .8, .06); }); },   // petit carillon montant
  annul(){ this.jouer(() => { this.note(784, 0, .35, .08, 'triangle'); this.note(587.3, .12, .5, .07, 'triangle'); }); },      // deux notes qui descendent
  err(){ this.jouer(() => { this.note(220, 0, .22, .07, 'triangle'); this.note(196, .1, .28, .06, 'triangle'); }); },          // son grave et doux
  clic(){ this.jouer(() => this.note(1800, 0, .05, .035, 'triangle')); },                                                      // tic très bref
  majBouton(){ const b = document.getElementById('son-btn'); if(!b) return;
    b.setAttribute('aria-pressed', String(this.actif)); b.classList.toggle('coupe', !this.actif);
    b.querySelector('span').textContent = this.actif ? 'Sons' : 'Sons coupés'; }
};
const CLICS = new Set(['r-start','a-start','r-date','r-slot','tab','logout','admin','r-back-dates','r-back-slots']);
document.getElementById('son-btn').addEventListener('click', () => {
  SON.actif = !SON.actif; try{ localStorage.setItem('resa-sons', SON.actif ? 'oui' : 'non'); }catch{}
  SON.majBouton(); announce(SON.actif ? 'Sons activés.' : 'Sons coupés.'); if(SON.actif) SON.clic();
});
SON.majBouton();

/* ====================== DÉMARRAGE ====================== */
(async () => {
  try{
    if(typeof emailjs !== 'undefined') emailjs.init({publicKey: CONFIG.EMAILJS_PUBLIC_KEY});
    loading('Chargement…');
    await loadSchema();
    await loadParams().catch(() => {});
    const missing = Object.entries(SCHEMA).filter(([k,v]) => v.absent.length && !v.optional);
    if(missing.length){
      show(card(`<h2>Configuration Airtable incomplète</h2>${msg('err','Certaines tables ou colonnes sont introuvables.')}<ul>${missing.map(([k,v]) => `<li>${esc(v.label)} : ${v.missingTable ? 'table introuvable' : 'colonnes manquantes : ' + esc(v.absent.join(', '))}</li>`).join('')}</ul>`));
      return;
    }
    const tok = new URLSearchParams(location.search).get('annuler');
    if(tok) history.replaceState(null, '', location.pathname);
    tok ? await cancelByLink(tok) : home();
  }catch(e){
    const s = e.status;
    show(card(`<h2>Connexion à la base impossible</h2>${msg('err', s === 403 ? 'Le jeton Airtable doit aussi avoir la permission « schema.bases:read » (lecture de la structure). Ouvrez le jeton dans Airtable et ajoutez cette permission.'
      : s === 401 ? 'Le jeton Airtable est invalide ou a été supprimé.' : s === 404 ? 'Base Airtable introuvable : vérifiez son identifiant.' : 'Erreur : ' + e.message)}
      <div class="actions"><button type="button" class="btn" onclick="location.reload()">Réessayer</button></div>`));
  }
})();
</script>
