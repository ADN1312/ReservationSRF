<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a5c">
<title>Réservation salle de remise en forme – UNADEV Toulouse</title>
<style>
:root{--bleu:#1b3a5c;--bleu2:#2c5f8a;--fond:#f6f4ef;--blanc:#fff;--texte:#1a1a1a;--gris:#555d6b;--bord:#c9ced6;--ok:#14663a;--err:#a31616;--accent:#e0a030;--orange:#9a5800}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:1.05rem/1.55 "Segoe UI",Arial,sans-serif;background:var(--fond);color:var(--texte)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:.5rem;z-index:10}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}

/* ---------- En-tête ---------- */
header{background:var(--bleu);color:#fff;padding:1.1rem 1rem 1.2rem}
.entete{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;max-width:1040px;margin:0 auto}
.logo-lien{justify-self:start;display:inline-block;border-radius:12px;line-height:0}
.logo-lien:hover .logo{box-shadow:0 0 0 3px var(--accent)}
.logo{height:64px;width:auto;background:#fff;border-radius:10px;padding:5px 8px;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:box-shadow .15s}
@media (forced-colors:active){.logo{forced-color-adjust:none;background:#fff}}   /* mode contraste de Windows : garder la pastille blanche du logo */
.titre{text-align:center}
header h1{margin:0;font-size:1.75rem;font-weight:600;letter-spacing:.01em;line-height:1.25}
.titre-deco{display:block;width:3.5rem;height:3px;border-radius:3px;background:var(--accent);margin:.55rem auto .45rem}
header .sous-titre{margin:0;font-size:.95rem;letter-spacing:.06em;opacity:.9}
.outils{justify-self:end}
.son-btn{display:inline-flex;align-items:center;gap:.35rem;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:.3rem .75rem;font-size:.85rem;font-weight:600;cursor:pointer;min-height:34px}
.son-btn:hover{background:rgba(255,255,255,.15)}
.son-btn.coupe{opacity:.8}.son-btn.coupe .ondes{display:none}

/* ---------- Mise en page ---------- */
main{max-width:760px;margin:1.5rem auto;padding:0 1rem}
main:focus{outline:none}
.card{background:var(--blanc);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:1.5rem}
.card+.card{margin-top:1rem}
h2{margin:0 0 1rem;color:var(--bleu);font-size:1.4rem}
h3{color:var(--bleu);margin:1.4rem 0 .5rem;font-size:1.15rem}
footer{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;padding:1.5rem 1rem;color:var(--gris)}
footer .btn.sec{color:var(--gris);border-color:var(--bord)}
body.admin footer{display:none}
body.admin main{max-width:1040px}

/* ---------- Boutons ---------- */
.btn,.btn-grand,.choix-btn{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.7rem 1.3rem;border-radius:9px;border:2px solid var(--bleu);background:var(--bleu);color:#fff;font-weight:600;min-height:44px;text-decoration:none}
.btn:hover{background:var(--bleu2);border-color:var(--bleu2)}
.btn.sec{background:#fff;color:var(--bleu)}.btn.sec:hover{background:#eef2f7}
.btn.danger{background:var(--err);border-color:var(--err)}
.btn.danger-sec{background:#fff;color:var(--err);border-color:#e3b1b1}.btn.danger-sec:hover{background:var(--err);color:#fff;border-color:var(--err)}
.btn.gros{font-size:1.2rem;padding:1rem 1.6rem}
.btn.petit{padding:.4rem .9rem;min-height:38px;font-size:.92rem;border-radius:8px}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.4rem}
.choix{display:grid;gap:1rem}
.btn-grand{display:block;width:100%;text-align:left;padding:1.2rem 1.4rem;border:2px solid var(--bleu2);border-radius:12px;background:#fff;color:var(--bleu)}
.btn-grand strong{display:block;font-size:1.25rem}.btn-grand span{color:var(--gris)}
.btn-grand:hover{background:var(--bleu);color:#fff}.btn-grand:hover span{color:#fff}
.liste{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.choix-btn{display:flex;justify-content:space-between;gap:1rem;width:100%;text-align:left;padding:.9rem 1.1rem;border:2px solid var(--bleu2);border-radius:10px;background:#fff;color:var(--bleu);font-weight:600;min-height:48px}
.choix-btn:hover{background:var(--bleu);color:#fff}
.choix-btn .etat{font-weight:400}
.choix-btn[aria-disabled=true]{background:#e6e8ec;border-color:#e6e8ec;color:var(--gris);cursor:not-allowed}

/* ---------- Formulaires ---------- */
fieldset{border:0;margin:0;padding:0}legend{font-weight:700;color:var(--bleu);margin-bottom:.6rem}
label{font-weight:600}
.champ{margin-bottom:1.1rem}.champ label{display:block;margin-bottom:.3rem}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;padding:.65rem .8rem;border:2px solid var(--bord);border-radius:8px;background:#fff;min-height:44px}
.rappel{display:flex;gap:.6rem;align-items:center;margin-top:.5rem}.rappel label{font-weight:400}.rappel input{width:20px;height:20px;flex:none}
.aide{margin:.25rem 0 0;font-size:.95em;color:var(--gris)}
[aria-invalid=true]{border-color:var(--err)!important}
.slot{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border:2px solid var(--bleu2);border-radius:10px;margin-bottom:.6rem;background:#fff;cursor:pointer;min-height:48px}
.slot input{width:22px;height:22px;accent-color:var(--bleu)}
.slot .etat{margin-left:auto;color:var(--gris)}
.slot.off{background:#e6e8ec;border-color:#e6e8ec;color:var(--gris);cursor:not-allowed}
.slot:has(input:checked){background:#e4edf7;border-color:var(--bleu)}
.encadre{border:2px solid var(--bord);border-radius:10px;padding:.8rem 1rem;margin:0 0 1rem}.encadre legend{font-weight:700;padding:0 .3rem}
.deux-col{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
details.repli{border:1px solid var(--bord);border-radius:10px;padding:.4rem 1rem;margin:0 0 1rem;background:#fafbfc}
details.repli>summary{cursor:pointer;font-weight:700;color:var(--bleu);padding:.4rem 0;min-height:36px}
details.repli[open]>summary{margin-bottom:.6rem}

/* ---------- Messages ---------- */
.msg{padding:.8rem 1rem;border-radius:9px;margin:0 0 1rem;font-weight:600;white-space:pre-line}
.msg.err{background:#fde8e8;color:var(--err);border:1px solid #f1a9a9}
.msg.ok{background:#e1f4e8;color:var(--ok);border:1px solid #9fd5b3}
.msg.info{background:#e4edf7;color:var(--bleu);border:1px solid #b5cae3}
.msg.att{background:#fdf1dc;color:var(--orange);border:1px solid #efc98a}
.annonce{border-left:6px solid var(--accent)}.annonce p{white-space:pre-line;margin:0}
.date-jour{color:var(--gris);margin:-.4rem 0 1.1rem}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.4rem 1.2rem;background:var(--fond);padding:1rem;border-radius:10px}
dt{color:var(--gris)}dd{margin:0;font-weight:600}
.puces{margin:.3rem 0 1rem;padding-left:1.3rem}.puces li{margin-bottom:.2rem}
.texte p{margin:0 0 .8rem}

/* ---------- Tableaux et listes de l'administration ---------- */
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bord);padding:.4rem .6rem;text-align:left}caption{text-align:left;font-weight:700;margin:.8rem 0 .3rem;color:var(--bleu)}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.4rem 0}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.85rem;font-weight:600;background:#e1f4e8;color:var(--ok)}
.badge.plein{background:#fde8e8;color:var(--err)}
.rangs{list-style:none;margin:0;padding:0;border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.rangs li{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap;padding:.6rem .9rem;background:#fff}
.rangs li+li{border-top:1px solid #e6e8ec}
.rangs li:nth-child(even){background:#fafbfc}
.rangs .boutons{display:flex;gap:.5rem;flex-wrap:wrap}
.discret{color:var(--gris);font-size:.95em}
.slotcard{border:1px solid var(--bord);border-radius:10px;padding:.8rem 1rem;margin-bottom:.7rem;background:#fff}
.slotcard h4{margin:0 0 .3rem;color:var(--bleu);display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.slotcard .rangs{margin-top:.5rem}
.journal li{padding:.5rem .8rem;background:var(--fond);border-radius:8px;margin-bottom:.4rem}
.journal small{display:block;color:var(--gris)}

/* ---------- Espace administrateur ---------- */
.adm-barre{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--blanc);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:.9rem 1.2rem;margin-bottom:1rem;border-left:6px solid var(--accent)}
.qui{display:flex;flex-direction:column;color:var(--gris)}.qui strong{color:var(--texte);font-weight:700}
.qui-titre{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bleu2);font-weight:700}
.btn.deco{background:#fff;color:var(--bleu);border-color:var(--bleu);border-radius:99px;padding:.5rem 1.1rem}
.btn.deco:hover{background:var(--bleu);color:#fff}
.adm-nav{position:relative;margin-bottom:1rem;z-index:6}
.menu-btn{display:inline-flex;align-items:center;gap:.55rem;background:var(--blanc);color:var(--bleu);border:2px solid var(--bleu);border-radius:12px;padding:.55rem 1rem;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08);min-height:44px}
.menu-btn:hover{background:#eef2f7}
.menu-actuel{font-weight:400;color:var(--gris)}.menu-actuel::before{content:"·";margin-right:.45rem;color:var(--bord)}
.chevron{transition:transform .15s;flex:none}[aria-expanded=true]>.chevron{transform:rotate(180deg)}
.menu{list-style:none;margin:0;padding:0}
.adm-nav>.menu{position:absolute;top:calc(100% + .35rem);left:0;min-width:19rem;background:var(--blanc);padding:.4rem;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);border:1px solid var(--bord)}
.menu-item{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--bleu);font-weight:600;padding:.6rem .9rem;min-height:44px;cursor:pointer}
.menu-item:hover,.menu-item:focus{background:#eef2f7}
.menu-item.groupe{font-weight:700;justify-content:space-between}
.menu-item[aria-current=page]{background:var(--bleu);color:#fff}
.menu .menu{margin:.1rem 0 .3rem .9rem;padding-left:.4rem;border-left:2px solid #e6e8ec}
.adm-contenu h2{padding-bottom:.6rem;border-bottom:2px solid #eef2f7}
.adm-contenu h3{margin-top:1.8rem}
.adm-contenu form{background:#fafbfc;border:1px solid #e6e8ec;border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem}
.adm-contenu details.repli form{background:none;border:0;padding:0}
.adm-contenu form h3{margin-top:0}
.adm-contenu form .champ{max-width:34rem}.adm-contenu .large .champ{max-width:none}
.adm-contenu table th{background:#eef2f7}
.semaine-nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin:0 0 1rem;padding:.6rem .8rem;background:#eef2f7;border-radius:10px}
.semaine-nav strong{color:var(--bleu)}.semaine-nav .boutons{display:flex;gap:.4rem;flex-wrap:wrap}
.jour-titre{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.jour-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin:.1rem 0 .8rem}
.jour-type{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.8rem;margin-bottom:1rem}
.jour-type .encadre{margin:0;background:#fff}
.jour-type .champ{margin-bottom:.6rem}
.plage{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:.4rem}
.plage label{font-weight:400}

/* ---------- Compteur d'e-mails ---------- */
.compteur{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:1rem 1.2rem;margin:0 0 1.2rem}
.compteur-haut{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.compteur-chiffre{font-size:2rem;font-weight:700;color:var(--bleu);line-height:1}.compteur-chiffre small{font-size:1rem;color:var(--gris);font-weight:600}
.jauge{position:relative;height:16px;border-radius:99px;background:#e9ecf1;border:1px solid var(--bord);overflow:hidden;margin:.7rem 0 .45rem}
.jauge>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,#2f9e62,#14663a);transition:width .6s ease}
.compteur.attention .jauge>span{background:linear-gradient(90deg,#f0b54a,#c77a00)}
.compteur.critique .jauge>span{background:linear-gradient(90deg,#e46a6a,#a31616)}
.niveau{font-weight:700;color:var(--ok)}.compteur.attention .niveau{color:var(--orange)}.compteur.critique .niveau{color:var(--err)}
.reperes{position:relative;height:1.2em;font-size:.8rem;color:var(--gris)}.reperes span{position:absolute;transform:translateX(-50%)}.reperes span:first-child{transform:none}.reperes span:last-child{transform:translateX(-100%)}
@media (forced-colors:active){.jauge{border:2px solid CanvasText}.jauge>span{background:Highlight;forced-color-adjust:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Jean-Jacques ---------- */
.jj{position:fixed;left:.5rem;bottom:.4rem;z-index:5;max-width:min(22rem,calc(100vw - 1rem))}
.jj-btn{background:none;border:0;padding:.2rem .3rem;font:italic .72rem/1.2 Georgia,serif;color:var(--gris);opacity:.45;cursor:pointer}
.jj-btn:hover,.jj-btn:focus-visible,.jj-btn[aria-expanded=true]{opacity:1}
.jj-plaque{position:absolute;bottom:1.8rem;left:0;width:22rem;max-width:calc(100vw - 1rem);box-shadow:0 6px 24px rgba(0,0,0,.25);padding:.8rem 1rem;border:3px double #8a7a5a;border-radius:6px;background:#f3eee2;color:#4a3f2a;font-family:Georgia,serif}
.jj-plaque p{margin:.3rem 0}.jj-indice{font-style:italic;font-size:.9em}
.jj-scene{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;background:linear-gradient(rgba(8,14,30,.78),rgba(8,14,30,.78) 60%,rgba(20,55,95,.9));animation:jjFond 10s ease-in-out forwards}
.jj-bateau{position:absolute;bottom:12%;left:0;width:min(70vw,460px);animation:jjVogue 10s linear forwards}
.jj-houle{animation:jjHoule 1.6s ease-in-out infinite alternate;transform-origin:50% 80%}
.jj-flamme{animation:jjFeu .35s ease-in-out infinite alternate;transform-origin:50% 100%}
.jj-flamme:nth-child(2){animation-duration:.5s}.jj-flamme:nth-child(3){animation-duration:.42s}
.jj-texte{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:min(90vw,40rem);text-align:center;font:italic 1.6rem/1.4 Georgia,serif;color:#fff;text-shadow:0 2px 8px #000,0 0 2px #000;opacity:0;animation:jjTexte 10s ease forwards}
@keyframes jjVogue{from{transform:translateX(-110%)}to{transform:translateX(110vw)}}
@keyframes jjHoule{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(6px)}}
@keyframes jjFeu{from{transform:scaleY(.85) skewX(-4deg)}to{transform:scaleY(1.15) skewX(4deg)}}
@keyframes jjTexte{0%,12%{opacity:0}22%,85%{opacity:1}100%{opacity:0}}
@keyframes jjFond{0%{opacity:0}8%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.jj-bateau{left:50%;transform:translateX(-50%)}.jj-texte,.jj-scene{opacity:1}}

/* ---------- Petits écrans (téléphones) : à laisser en dernier ---------- */
@media (max-width:640px){
  body{font-size:1rem}
  header{padding:.7rem .8rem .9rem}
  .entete{grid-template-columns:1fr auto;grid-template-areas:"logo outils" "titre titre";gap:.5rem .8rem}
  .logo-lien{grid-area:logo}.outils{grid-area:outils}.titre{grid-area:titre}
  .logo{height:42px;padding:3px 6px}
  header h1{font-size:1.35rem}header .sous-titre{font-size:.85rem}.titre-deco{margin:.4rem auto .3rem}
  main{margin:.9rem auto;padding:0 .7rem}
  .card{padding:1rem}
  h2{font-size:1.22rem;margin-bottom:.8rem}h3{font-size:1.05rem}
  .btn{padding:.6rem 1rem;font-size:.97rem}
  .btn.gros{font-size:1.05rem;padding:.8rem 1.1rem}
  .actions{gap:.6rem}.actions .btn{flex:1 1 auto}
  .btn-grand{padding:.95rem 1rem}.btn-grand strong{font-size:1.1rem}
  .choix-btn{flex-wrap:wrap;gap:.2rem .8rem;padding:.75rem .9rem}
  dl{grid-template-columns:1fr;gap:.1rem}dd{margin-bottom:.5rem}
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{font-size:16px}
  .rappel input{width:24px;height:24px}
  .deux-col{grid-template-columns:1fr}
  body.admin main{padding:0 .5rem}
  .adm-barre{padding:.7rem .9rem;margin-bottom:.6rem}
  .btn.deco{padding:.4rem .8rem;font-size:.9rem;min-height:38px}
  .menu-btn{width:100%;justify-content:flex-start}.menu-btn .chevron{margin-left:auto}
  .adm-nav>.menu{right:0;min-width:0}
  .rangs li{padding:.55rem .7rem}
  .slotcard{padding:.7rem .8rem}
  .adm-contenu form{padding:.8rem}
  table{font-size:.92rem}th,td{padding:.35rem .45rem}
  .jj{position:static;margin:1.5rem 0 .5rem;max-width:none}.jj-plaque{position:static;width:auto;margin-top:.5rem}.jj-btn{font-size:.68rem}
}
</style>
</head>
<body>
<a class="skip" href="#app">Aller au contenu</a>
<header><div class="entete">
  <a class="logo-lien" href="https://www.unadev.com/" target="_blank" rel="noopener"><img class="logo" src="logo-unadev.png" alt="UNADEV, site officiel (nouvel onglet)" onerror="this.replaceWith('UNADEV')"></a>
  <div class="titre"><h1>Réservation salle de remise en forme</h1><span class="titre-deco" aria-hidden="true"></span><p class="sous-titre">UNADEV Toulouse · Équipe sportive</p></div>
  <div class="outils"><button type="button" class="son-btn" id="son-btn"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="ondes" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Sons du site activés</span></button></div>
</div></header>
<main id="app" tabindex="-1"><noscript>Ce site nécessite JavaScript.</noscript></main>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<footer aria-label="Liens utiles">
  <button type="button" class="btn sec petit" data-act="contact">Contacter l'équipe sportive</button>
  <button type="button" class="btn sec petit" data-act="rgpd">Vos données personnelles</button>
  <button type="button" class="btn sec petit" data-act="admin">Espace administrateur</button>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ====================== CONFIGURATION ====================== */
const CONFIG = {
  PROXY_URL: 'https://steep-frost-cb5e.pnjst9nf55.workers.dev',   // relais Cloudflare : il détient le jeton Airtable
  AIRTABLE_BASE: 'appKZpxOpugzYhRTV',
  EMAILJS_PUBLIC_KEY: 'qrm4ufE6HldEP1WhC',
  EMAILJS_SERVICE: 'réservation',
  TEMPLATE_NOTIFICATION: 'template_1wihay6',   // seul modèle utilisé, pour tous les e-mails. Variables : sujet, message, to_email, from_name
  LIEU: 'UNADEV, 11 rue du Moulin Bayard, 31000 Toulouse',
  HORIZON: 56,            // on réserve et on crée les créneaux jusqu'à 8 semaines à l'avance (56 jours)
  QUOTA: 200, ALERTE: 160, COUPURE: 190,   // e-mails par mois (formule gratuite d'EmailJS)
  NETTOYAGE: 28,          // nettoyage automatique toutes les 4 semaines
  TAILLE_ARCHIVE: 90000   // caractères par fiche d'archive (Airtable accepte 100 000 au maximum)
};
const SIGNATURE = "L'équipe sportive de l'UNADEV de Toulouse";
const EXPEDITEUR = 'Salle de remise en forme - UNADEV Toulouse';

/* ====================== OUTILS ====================== */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => { const d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const ecart = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 864e5);   // nombre de jours de a à b
const jourSem = iso => (dateOf(iso).getDay() + 6) % 7 + 1;             // 1 = lundi … 7 = dimanche
const lundiDe = iso => addDays(iso, 1 - jourSem(iso));
const moisDe = iso => iso.slice(0, 7);
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h*60 + m; };
const fromMin = x => `${pad(Math.floor(x/60))}:${pad(x%60)}`;
function normTime(t){ const m = String(t||'').trim().match(/^(\d{1,2})\s*(?:[:hH]\s*(\d{2})?)?$/); return m ? `${pad(+m[1])}:${m[2]||'00'}` : String(t||'').trim(); }
const JOURS = ['', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function fmtDate(iso){ return dateOf(iso).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(/ 1 /, ' 1er '); }
const fmtMois = m => `${MOIS[+m.slice(5,7) - 1]} ${m.slice(0,4)}`;
const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
/* « Aujourd'hui, lundi 23 novembre 2026 » : plus parlant à l'écoute qu'une date seule. */
const jourDit = iso => { const t = todayISO(); return (iso === t ? "Aujourd'hui, " : iso === addDays(t, 1) ? 'Demain, ' : '') + fmtDate(iso); };
const fmtH = t => { const [h, m] = t.split(':'); return `${+h} h${m === '00' ? '' : ' ' + m}`; };   // « 09:00 » devient « 9 h »
const plage = s => `${fmtH(s.debut)} à ${fmtH(s.fin)}`;
const fmtShort = iso => iso.split('-').reverse().join('/');
const cmpSlot = (a, b) => (a.date + a.debut).localeCompare(b.date + b.debut);
const plural = (n, s, p) => n > 1 ? p : s;
const nb = (n, s, p) => `${n} ${plural(n, s, p)}`;
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const memeEmail = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
const rand = (n = 16) => crypto.randomUUID().replace(/-/g, '').slice(0, n);
const listeFr = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' et ' + a[a.length - 1];

/* Erreur dans un formulaire : message en haut, saisie conservée, curseur placé sur le champ fautif. */
function fieldError(form, id, m){
  form.querySelectorAll('[aria-invalid]').forEach(x => x.removeAttribute('aria-invalid'));
  let p = form.querySelector('.msg.err'); if(!p){ p = document.createElement('p'); p.className = 'msg err'; form.prepend(p); }

/* ====================== AIRTABLE ====================== */
const API = CONFIG.PROXY_URL + '/v0';
const BASE = CONFIG.AIRTABLE_BASE;
const pause = ms => new Promise(r => setTimeout(r, ms));
async function at(path, opt = {}){
  for(let essai = 0; ; essai++){
    const r = await fetch(API + path, {...opt, headers: opt.body ? {'Content-Type': 'application/json'} : {}});
    let data = null; try{ data = await r.json(); }catch{}
    if(r.status === 429 && essai < 4){ await pause(1200 * (essai + 1)); continue; }   // Airtable : 5 demandes par seconde au maximum, on patiente puis on réessaie
    if(!r.ok){ const e = new Error(data?.error?.message || ('Erreur ' + r.status)); e.status = r.status; e.kind = data?.error?.type; throw e; }
    return data;
  }
}

let SCHEMA = {};
async function loadSchema(){
  const d = await at(`/meta/bases/${BASE}/tables`);
  SCHEMA = {};
  for(const [key, def] of Object.entries(DEF)){
    const t = d.tables.find(t => def.names.includes(norm(t.name)));
    const s = SCHEMA[key] = {label: def.label, optional: !!def.optional, id: t?.id, realName: t?.name, fields: {}, absent: [], missingTable: !t};
    if(!t){ s.absent = def.needed.slice(); continue; }
    for(const [lk, cands] of Object.entries(def.fields)){
      let found = null;
      for(const c of cands){ found = t.fields.find(f => norm(f.name) === c); if(found) break; }
      if(found) s.fields[lk] = found.name;
    }
    s.absent = def.needed.filter(k => !s.fields[k]);
  }
}
const tableOk = key => !!SCHEMA[key]?.id && !SCHEMA[key].absent.length;
const parametresOk = () => tableOk('parametres');
const archivesOk = () => tableOk('archives');

const toReal = (key, f) => { const o = {}; for(const [k, v] of Object.entries(f)){ const n = SCHEMA[key].fields[k]; if(n && v !== undefined) o[n] = v; } return o; };
const gf = (rec, key, k) => rec.fields[SCHEMA[key].fields[k]];
async function listAll(key){
  let out = [], off;
  do{
    const d = await at(`/${BASE}/${SCHEMA[key].id}?pageSize=100` + (off ? `&offset=${encodeURIComponent(off)}` : ''));
    out = out.concat(d.records); off = d.offset;
  }while(off);
  return out;
}
async function createRecs(key, list){
  const res = [];
  for(let i = 0; i < list.length; i += 10){
    const records = list.slice(i, i+10).map(f => ({fields: toReal(key, f)}));
    res.push(...(await at(`/${BASE}/${SCHEMA[key].id}`, {method:'POST', body: JSON.stringify({records, typecast:true})})).records);
  }
  return res;
}
async function updateRecs(key, list){
  for(let i = 0; i < list.length; i += 10){
    const records = list.slice(i, i+10).map(x => ({id: x.id, fields: toReal(key, x.f)}));
    await at(`/${BASE}/${SCHEMA[key].id}`, {method:'PATCH', body: JSON.stringify({records, typecast:true})});
  }
}
async function deleteRecs(key, ids){
  for(let i = 0; i < ids.length; i += 10){
    const q = ids.slice(i, i+10).map(id => 'records[]=' + encodeURIComponent(id)).join('&');
    await at(`/${BASE}/${SCHEMA[key].id}?${q}`, {method:'DELETE'});
  }
}

function parseResa(r){
  const f = k => gf(r, 'reservations', k);
  const raw = f('statut');
  return {id:r.id, nom:f('nom')||'', prenom:f('prenom')||'', email:String(f('email')||'').trim(), date:String(f('date')||'').slice(0,10),
    debut:normTime(f('debut')), fin:normTime(f('fin')), statutRaw: raw || 'Confirmée', ok: !raw || norm(raw) === 'confirmee', token:f('token')||''};
}
function parseSlot(r){
  const f = k => gf(r, 'creneaux', k);
  return {id:r.id, date:String(f('date')||'').slice(0,10), debut:normTime(f('debut')), fin:normTime(f('fin')), cap:Number(f('capacite'))||0,
    actif: SCHEMA.creneaux.fields.actif ? !!f('actif') : true};
}
function parseFerm(r){
  const f = k => gf(r, 'fermetures', k);
  return {id:r.id, date:String(f('date')||'').slice(0,10), debut:normTime(f('debut')), fin:normTime(f('fin')), journee:!!f('journee'), motif:f('motif')||''};
}
function parseAdmin(r){
  const f = k => gf(r, 'administrateurs', k);
  const a = {id:r.id, nom:f('nom')||'', prenom:f('prenom')||'', email:String(f('email')||'').trim(), pin:String(f('pin')||''),
    actif: SCHEMA.administrateurs.fields.actif ? !!f('actif') : true};
  a.full = `${a.prenom} ${a.nom}`.trim();
  return a;
}
const memeCreneau = (r, s) => r.date === s.date && r.debut === s.debut && r.fin === s.fin;
const closedBy = (s, ferms) => ferms.some(x => x.date === s.date && (x.journee || (x.debut && x.fin && s.debut >= x.debut && s.fin <= x.fin)));
const jourFerme = (iso, ferms) => ferms.some(x => x.date === iso && x.journee);
async function loadPlanning(){
  const [c, r, f] = await Promise.all([listAll('creneaux'), listAll('reservations'), listAll('fermetures')]);
  const resas = r.map(parseResa).filter(x => x.ok);
  const ferms = f.map(parseFerm);
  const slots = c.map(parseSlot).filter(s => s.date && s.debut && s.fin && s.actif).map(s => {
    s.people = resas.filter(x => memeCreneau(x, s));
    s.taken = s.people.length; s.left = Math.max(0, s.cap - s.taken);
    s.full = s.taken >= s.cap; s.closed = closedBy(s, ferms); return s;
  }).sort(cmpSlot);
  return {slots, resas, ferms};
}

/* Regroupe les réservations par lien d'annulation : une réservation à 2 places (avec accompagnant) partage le même lien. */
function parLien(resas){
  const m = new Map();
  for(const r of resas.slice().sort(cmpSlot)){ if(!m.has(r.token)) m.set(r.token, []); m.get(r.token).push(r); }
  return [...m.values()].map(recs => ({token: recs[0].token, recs, ...recs[0], serie: serieDe(recs[0].token)}));
}
/* Réservation répétée : chaque séance a son propre lien « série-numéro ». */
const serieDe = token => token.includes('-') ? token.split('-')[0] : '';
const avecQui = g => g.recs.length > 1 ? ` (2 places, avec ${g.recs.slice(1).map(x => `${x.prenom} ${x.nom}`).join(', ')})` : '';

/* ====================== CODES PIN ====================== */
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('resa-sref|' + pin));
  return 'sha256:' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function pinMatches(stored, pin){ return !stored ? false : stored.startsWith('sha256:') ? stored === await hashPin(pin) : stored === pin; }

async function loadParams(){
  S.params = {}; S.paramIds = {};
  if(!parametresOk()) return;
  for(const r of await listAll('parametres')){ const k = gf(r, 'parametres', 'cle'); if(k){ S.params[k] = gf(r, 'parametres', 'valeur') ?? ''; S.paramIds[k] = r.id; } }
}
async function saveParams(obj){
  if(!parametresOk()) throw new Error('la table « Paramètres » est introuvable dans Airtable');
  const upd = [], add = [];
  for(const [cle, valeur] of Object.entries(obj)) S.paramIds[cle] ? upd.push({id:S.paramIds[cle], f:{valeur}}) : add.push({cle, valeur});
  if(upd.length) await updateRecs('parametres', upd);
  if(add.length) await createRecs('parametres', add);
  await loadParams();
}

/* Remplace les repères entre crochets ; majuscules et accents sont tolérés ([Prenom] = [prénom]). */
function fill(text, vars){
  const v = {}; for(const [k, x] of Object.entries(vars)) v[norm(k)] = x;
  return text.replace(/\[([^\]]+)\]/g, (m, k) => v[norm(k)] ?? m);
}
/* Les textes enregistrés avant le changement de nom gardent l'ancienne signature : on la remplace à la volée. */
const signer = t => t.replace(/L['’]équipe Résa\.SREF/g, SIGNATURE);
const tpl = k => ({sujet: signer(param(`mail.${k}.sujet`, MAILS[k].sujet)), corps: signer(param(`mail.${k}.corps`, MAILS[k].corps))});

/* Compteur d'e-mails du mois : estimation tenue dans « Paramètres » (le vrai compteur est chez EmailJS). */
const CPT = {n: 0};
const cleCompteur = () => 'compteur.' + moisDe(todayISO());
const compteur = () => (+param(cleCompteur(), 0) || 0) + CPT.n;
async function enregistrerCompteur(){
  if(!CPT.n || !parametresOk()) return;
  const ajout = CPT.n; CPT.n = 0;
  try{ await loadParams(); await saveParams({[cleCompteur()]: String((+param(cleCompteur(), 0) || 0) + ajout)}); }catch{ CPT.n += ajout; }
}
async function mail(template, params){
  try{
    if(typeof emailjs === 'undefined') throw {text:'Service e-mail non chargé'};
    await emailjs.send(CONFIG.EMAILJS_SERVICE, template, params);
    CPT.n++;
    return {ok:true};
  }catch(e){ return {ok:false, status:e.status, err: e.text || e.message || 'échec'}; }
}
const send = (to, sujet, message) => mail(CONFIG.TEMPLATE_NOTIFICATION, {to_email:to, sujet, message, from_name: param('expediteur', EXPEDITEUR)});
const avecAccomp = (texte, vars) => vars.accompagnant && !/\[accompagnant\]/i.test(texte) ? texte + `\n\nPersonne qui vous accompagne : ${vars.accompagnant.replace(/^, avec /, '')}.` : texte;
/* Envoie le modèle « k » à une personne. corps : texte retouché par l'administrateur (fermeture, planning…). */
const mailUser = (to, k, vars, corps) => { const t = tpl(k); return send(to, fill(t.sujet, vars), fill(avecAccomp(corps ?? t.corps, vars), vars)); };
/* Prévient les administrateurs. type : 'resa', 'annul', ou null (tous). sauf : l'administrateur à l'origine de l'action.
   Au-delà de 190 e-mails dans le mois, ces avis sont coupés pour garder les derniers envois aux utilisateurs. */
async function mailAdmins(k, vars, type, sauf){
  await loadParams().catch(() => {});
  if(compteur() >= CONFIG.COUPURE) return {ok:true, coupe:true};
  const to = (await loadAdmins()).filter(a => a.id !== sauf && (!type || notifOn(a.id, type))).map(a => a.email).filter(Boolean);
  if(!to.length) return {ok:true};
  const t = tpl(k), sujet = fill(t.sujet, vars), message = fill(avecAccomp(t.corps, vars), vars);
  const r = await send(to.join(','), sujet, message);
  if(r.ok || to.length === 1 || ![400,422].includes(r.status)) return r;
  let ok = false; for(const x of to){ if((await send(x, sujet, message)).ok) ok = true; }
  return {ok};
}

/* Annule des réservations et prévient chaque personne une seule fois, avec la liste de ses réservations annulées. */
async function annulerEtPrevenir(resas, k, corps, varsCommunes = {}){
  if(!resas.length) return {sent:0, n:0, failed:[]};
  await updateRecs('reservations', resas.map(r => ({id:r.id, f:{statut:'Annulée'}})));
  const parPersonne = new Map();
  for(const r of resas.slice().sort(cmpSlot)){ const e = r.email.toLowerCase(); if(!parPersonne.has(e)) parPersonne.set(e, []); parPersonne.get(e).push(r); }
  let sent = 0; const failed = [];
  for(const list of parPersonne.values()){
    const r = list[0], lignes = parLien(list).map(g => `• ${cap1(fmtDate(g.date))}, de ${plage(g)}${avecQui(g)}`);
    const m = await mailUser(r.email, k, {...varsCommunes, prenom:r.prenom, nom:r.nom, date:listeFr([...new Set(list.map(x => fmtDate(x.date)))]),
      heure:listeFr([...new Set(list.map(plage))]), 'réservations':lignes.join('\n')}, corps);
    m.ok ? sent++ : failed.push(r.email);
  }
  return {sent, n: parPersonne.size, failed};
}

/* Fichier agenda (.ics) : s'ouvre dans Outlook, l'agenda Google ou le Calendrier de l'iPhone. */
function ics(rows){
  const utc = (iso, hm) => { const [h, m] = hm.split(':').map(Number), d = dateOf(iso); d.setHours(h, m); return d.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z'; };
  const echap = t => t.replace(/[\\,;]/g, c => '\\' + c);
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//UNADEV Toulouse//Reservation salle de remise en forme//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  for(const r of rows) L.push('BEGIN:VEVENT', `UID:${r.token}@reservation-salle-unadev`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART:${utc(r.date, r.debut)}`, `DTEND:${utc(r.date, r.fin)}`, 'SUMMARY:Salle de remise en forme', `LOCATION:${echap(CONFIG.LIEU)}`,
    `DESCRIPTION:${echap('Réservation de la salle de remise en forme. Pour annuler, utilisez le lien reçu par e-mail.')}`, 'END:VEVENT');
  L.push('END:VCALENDAR');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(L.join('\r\n'));
}

async function cancelByLink(token, serie){
  loading('Vérification du lien…');
  const all = (await listAll('reservations')).map(parseResa).filter(r => r.ok);
  S.toutes = all.filter(aVenir);
  const groupes = parLien(serie ? S.toutes.filter(r => serieDe(r.token) === serie) : all.filter(r => r.token === token));
  const invalide = t => show(card(`<h2>Lien d'annulation</h2><p>${t}</p><div class="actions">${btn('home','Retour à l\'accueil')}</div>`));
  if(!groupes.length) return invalide(serie ? 'Il ne reste aucune séance à venir dans cette série : elles sont passées ou déjà annulées.' : 'Ce lien est incorrect, ou la réservation est déjà annulée.');

  S.cancel = groupes[0]; S.who.email = S.cancel.email; renderCancelConfirm(!!serie);
}

A.login = async fd => {
  const pin = fd.get('pin').trim(); const admins = await loadAdmins();
  let found = null; for(const a of admins){ if(await pinMatches(a.pin, pin)){ found = a; break; } }
  if(!found){ await pause(800); return renderLogin(admins, 'Code PIN incorrect.'); }
  S.admin = found; await entretien();
};
async function newAdminRecord(fd, admins){
  const o = {prenom: fd.get('prenom').trim(), nom: fd.get('nom').trim(), email: fd.get('email').trim(), pin: fd.get('pin').trim()};
  if(!o.prenom) return {err:'Renseignez le prénom.', field:'a-prenom'};
  if(!o.nom) return {err:'Renseignez le nom.', field:'a-nom'};
  if(!emailOk(o.email)) return {err:'L\'adresse e-mail n\'est pas valide.', field:'a-email'};
  if(!/^\d{4}$/.test(o.pin)) return {err:'Le code PIN doit comporter exactement 4 chiffres.', field:'a-pin'};
  for(const a of admins) if(await pinMatches(a.pin, o.pin)) return {err:'Ce code PIN est déjà utilisé par un autre administrateur. Choisissez-en un autre.', field:'a-pin'};
  const [rec] = await createRecs('administrateurs', [{nom:o.nom, prenom:o.prenom, email:o.email, pin: await hashPin(o.pin), actif:true}]);
  return {admin: parseAdmin(rec)};
}
A['first-admin'] = async (fd, form) => {

  const r = await newAdminRecord(fd, admins); if(r.err) return fieldError(form, r.field, r.err);
  S.admin = r.admin; await logAction('Création du premier administrateur', r.admin.full); adminTab('planning');
};
/* À chaque connexion : on complète le planning (8 semaines à l'avance), on fait le nettoyage s'il est dû, on surveille le compteur d'e-mails. */
async function entretien(){
  loading('Mise à jour du planning…');
  const notes = [];
  await loadParams().catch(() => {});
  try{ const n = await genererAuto(); if(n) notes.push(n); }catch(e){ notes.push('La création automatique des créneaux a échoué : ' + e.message); }
  try{ const n = await nettoyer(); if(n) notes.push(n); }catch(e){ notes.push('Le nettoyage automatique a échoué : ' + e.message); }
  try{ const n = await expirerArchives(); if(n) notes.push(n); }catch(e){ notes.push('La vérification des archives a échoué : ' + e.message); }
  const c = compteur();
  if(c >= CONFIG.ALERTE) notes.push(`Attention : environ ${c} e-mails sur ${CONFIG.QUOTA} ont été envoyés ce mois-ci.${c >= CONFIG.COUPURE ? ' Les avis aux administrateurs sont coupés jusqu\'au mois prochain.' : ''} Le détail est dans Réglages, « Réglages e-mail ».`);
  S.semaineVue = null;
  adminTab('planning', notes.length ? {t: c >= CONFIG.ALERTE ? 'att' : 'info', m: notes.join('\n\n')} : null);
}

/* Menu à deux niveaux, au clavier comme un menu Windows :
   flèches haut et bas = parcourir, flèche droite ou Entrée = ouvrir un thème, flèche gauche = revenir, Échap = fermer. */
const menuBtn = () => document.getElementById('menu-adm-btn');
function menuAdm(ouvrir, rendreFocus){
  const b = menuBtn(), l = document.getElementById('menu-adm'); if(!b || !l) return;
  b.setAttribute('aria-expanded', String(ouvrir)); l.hidden = !ouvrir;
  l.querySelectorAll('.groupe').forEach(g => sousMenu(g, false));
  if(ouvrir){
    const actuel = l.querySelector('[aria-current]');
    (actuel ? actuel.closest('ul').previousElementSibling : l.querySelector('.groupe')).focus();
  } else if(rendreFocus) b.focus();
}
function sousMenu(g, ouvrir, focusPremier){
  g.setAttribute('aria-expanded', String(ouvrir)); g.nextElementSibling.hidden = !ouvrir;
  if(ouvrir && focusPremier) g.nextElementSibling.querySelector('.menu-item').focus();
}
A.menu = () => menuAdm(menuBtn().getAttribute('aria-expanded') !== 'true');
A['menu-grp'] = (d, el) => { const ouvrir = el.getAttribute('aria-expanded') !== 'true'; sousMenu(el, ouvrir, ouvrir); };
document.addEventListener('keydown', e => {
  const it = e.target.closest?.('.menu-item'); if(!it) { if(e.key === 'Escape' && menuBtn()?.getAttribute('aria-expanded') === 'true'){ e.preventDefault(); menuAdm(false, true); } return; }
  const liste = [...it.closest('ul').children].map(li => li.querySelector('.menu-item')), i = liste.indexOf(it);
  const groupe = it.classList.contains('groupe'), parent = it.closest('ul').previousElementSibling;
  const aller = el => { e.preventDefault(); el.focus(); };
  switch(e.key){
    case 'ArrowDown': return aller(liste[(i + 1) % liste.length]);
    case 'ArrowUp': return aller(liste[(i - 1 + liste.length) % liste.length]);
    case 'Home': return aller(liste[0]);
    case 'End': return aller(liste[liste.length - 1]);
    case 'ArrowRight': if(groupe){ e.preventDefault(); sousMenu(it, true, true); } return;
    case 'Enter': case ' ': if(groupe){ e.preventDefault(); sousMenu(it, true, true); } return;
    case 'ArrowLeft': if(parent?.classList.contains('groupe')){ e.preventDefault(); sousMenu(parent, false); parent.focus(); } return;
    case 'Escape': e.preventDefault(); return menuAdm(false, true);
    case 'Tab': return menuAdm(false);
  }
});
document.addEventListener('click', e => { if(!e.target.closest('.adm-nav')) menuAdm(false); });
document.addEventListener('focusin', e => { if(!e.target.closest('.adm-nav') && menuBtn()?.getAttribute('aria-expanded') === 'true') menuAdm(false); });

/* ====================== RÉCURRENCE : SEMAINE TYPE ======================
   Stockée dans « Paramètres » (clé « semaine ») :
   versions : semaines types successives, chacune valable à partir d'une date ; fin : date de fin ou vide ;
   jusqua : dernier jour déjà créé ; supprimes : jours supprimés à la main, à ne jamais recréer.
   Les créneaux sont créés au fur et à mesure, 8 semaines à l'avance, à chaque connexion d'un administrateur. */
function paques(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l) / 451);
  const mois = Math.floor((h + l - 7*m + 114) / 31), jour = (h + l - 7*m + 114) % 31 + 1;
  return `${y}-${pad(mois)}-${pad(jour)}`;
}
const PENTECOTE = 'Lundi de Pentecôte';
function feriesDe(y){
  const p = paques(y);
  return {[`${y}-01-01`]:"Jour de l'an", [addDays(p, 1)]:'Lundi de Pâques', [`${y}-05-01`]:'Fête du Travail', [`${y}-05-08`]:'Victoire de 1945',
    [addDays(p, 39)]:'Ascension', [addDays(p, 50)]:PENTECOTE, [`${y}-07-14`]:'Fête nationale', [`${y}-08-15`]:'Assomption',
    [`${y}-11-01`]:'Toussaint', [`${y}-11-11`]:'Armistice de 1918', [`${y}-12-25`]:'Noël'};
}
const solidariteTravaillee = () => param('solidarite', 'oui') === 'oui';
/* Nom du jour férié chômé, ou '' (le lundi de Pentecôte est travaillé par défaut : journée de solidarité). */
const ferie = iso => { const n = feriesDe(+iso.slice(0, 4))[iso] || ''; return n === PENTECOTE && solidariteTravaillee() ? '' : n; };
const congeDe = (iso, conges) => conges.find(c => iso >= c.du && iso <= c.au);
const versionDe = (sem, iso) => (sem?.versions || []).filter(v => v.depuis <= iso).sort((a, b) => a.depuis.localeCompare(b.depuis)).pop();
function creneauxType(v, iso){
  const j = v?.jours?.[jourSem(iso)], out = []; if(!j) return out;
  for(const [o, f] of j.plages) for(let x = toMin(o); x + 60 <= toMin(f); x += 60) out.push({debut: fromMin(x), fin: fromMin(x + 60), cap: j.n});
  return out;
}
/* Ce que la semaine type et les congés prévoient pour un jour. null = ne pas toucher à ce jour. */
function prevu(iso, ctx, nouveau){
  const {sem, conges} = ctx, v = versionDe(sem, iso), apresFin = sem?.fin && iso > sem.fin, regulier = v && !apresFin ? creneauxType(v, iso) : [];
  if(congeDe(iso, conges)) return {slots:[], raison:'conge', regulier};
  if(!v) return null;
  if(apresFin) return {slots:[], raison:'fin', regulier};
  if(sem.supprimes.includes(iso) || ferie(iso)) return nouveau ? {slots:[], raison: ferie(iso) ? 'ferie' : 'supprime', nom: ferie(iso), regulier} : null;
  return {slots: regulier, regulier};
}
/* Calcule, du jour « du » au jour « au », les créneaux à créer, à supprimer et dont le nombre de places change.
   Jours pas encore créés : création, sans jamais écraser un jour qui existe déjà. Jours déjà créés : comparaison. */
function planifier(ctx, du, au, plan){
  const t = todayISO(), lim = addDays(t, CONFIG.HORIZON), sem = ctx.sem, finGen = sem?.fin && sem.fin < lim ? sem.fin : lim;
  const ops = {creer:[], suppr:[], places:[], resas:[], feries:[], conges:[], fermes:[], existants:[], jusqua: sem?.jusqua || ''};
  if(du < t) du = t;
  for(let d = du; d <= au; d = addDays(d, 1)){
    const nouveau = !sem?.jusqua || d > sem.jusqua, p = prevu(d, ctx, nouveau);
    if(!p) continue;
    const ex = plan.slots.filter(s => s.date === d);
    if(nouveau && p.raison !== 'conge'){
      if(d > finGen) continue;
      if(p.raison === 'ferie' && p.regulier.length) ops.feries.push({d, nom:p.nom});
      if(!p.slots.length) continue;
      if(ex.length){ ops.existants.push(d); continue; }
      if(jourFerme(d, plan.ferms)){ ops.fermes.push(d); continue; }
      ops.creer.push(...p.slots.filter(x => aVenir({date:d, debut:x.debut})).map(x => ({date:d, ...x})));
      continue;
    }
    if(p.raison === 'conge' && (ex.length || p.regulier.length)) ops.conges.push(d);
    for(const s of ex){
      const v = p.slots.find(x => x.debut === s.debut && x.fin === s.fin);
      if(!v){ if(aVenir(s)){ ops.suppr.push(s); ops.resas.push(...s.people); } }
      else if(v.cap !== s.cap) ops.places.push({s, cap: Math.max(v.cap, s.taken), voulu: v.cap});
    }
    if(!jourFerme(d, plan.ferms)) for(const v of p.slots) if(!ex.some(s => s.debut === v.debut && s.fin === v.fin) && aVenir({date:d, debut:v.debut})) ops.creer.push({date:d, ...v});
  }
  if(sem && (!sem.jusqua || du <= addDays(sem.jusqua, 1))){ const fin = au < finGen ? au : finGen; if(fin > ops.jusqua) ops.jusqua = fin; }
  return ops;
}
async function appliquer(ops, message){
  const r = await annulerEtPrevenir(ops.resas, 'planning', message);
  if(ops.suppr.length) await deleteRecs('creneaux', ops.suppr.map(s => s.id));
  if(ops.places.length) await updateRecs('creneaux', ops.places.map(x => ({id:x.s.id, f:{capacite:x.cap}})));
  if(ops.creer.length) await createRecs('creneaux', ops.creer.map(x => ({date:x.date, debut:x.debut, fin:x.fin, capacite:x.cap, actif:true})));
  return r;
}
const joursListe = l => listeFr(l.map(d => fmtDate(typeof d === 'string' ? d : d.d).replace(/ \d{4}$/, '') + (d.nom ? ` (${d.nom})` : '')));
function resumePlan(ops){
  const jours = l => [...new Set(l.map(x => x.date))];
  const L = [];
  if(ops.creer.length) L.push(`${nb(ops.creer.length, 'créneau sera créé', 'créneaux seront créés')}, sur ${nb(jours(ops.creer).length, 'jour', 'jours')} (du ${fmtDate(ops.creer[0].date)} au ${fmtDate(ops.creer[ops.creer.length - 1].date)}).`);
  if(ops.suppr.length) L.push(`${nb(ops.suppr.length, 'créneau sera supprimé', 'créneaux seront supprimés')} : ${joursListe(jours(ops.suppr))}.`);
  if(ops.places.length) L.push(`Le nombre de places changera sur ${nb(ops.places.length, 'créneau', 'créneaux')}.${ops.places.some(x => x.cap > x.voulu) ? ' Sur certains, il reste plus élevé que prévu, car des personnes y sont déjà inscrites.' : ''}`);
  if(ops.feries.length) L.push(`Jours fériés sautés : ${joursListe(ops.feries)}.`);
  if(ops.conges.length) L.push(`Jours de congés : ${joursListe(ops.conges)}.`);
  if(ops.existants.length) L.push(`Jours déjà ouverts, laissés tels quels : ${joursListe(ops.existants)}.`);

  return (L.length ? `<ul class="puces">${L.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>Aucun changement sur les 8 prochaines semaines.</p>') + att;

const ctxPlan = (sem, conges) => ({sem: sem ? {supprimes: [], ...sem} : null, conges: conges ?? paramJSON('conges', [])});
/* Création automatique, à la connexion : seulement les jours pas encore créés. */
async function genererAuto(){
  const sem = paramJSON('semaine', null); if(!sem?.versions?.length) return '';
  const t = todayISO(), lim = addDays(t, CONFIG.HORIZON), du = sem.jusqua ? addDays(sem.jusqua, 1) : sem.versions[0].depuis;
  const supprimes = (sem.supprimes || []).filter(d => d >= t), menage = supprimes.length !== (sem.supprimes || []).length;
  if(du > lim){ if(menage) await saveParams({semaine: JSON.stringify({...sem, supprimes})}); return ''; }
  const ops = planifier(ctxPlan({...sem, supprimes}), du, lim, await loadPlanning());
  await appliquer(ops);
  if(menage || ops.jusqua !== sem.jusqua) await saveParams({semaine: JSON.stringify({...sem, supprimes, jusqua: ops.jusqua})});   // on n'écrit que s'il y a du nouveau
  if(!ops.creer.length && !ops.fermes.length) return '';
  await logAction('Création automatique des créneaux', `${ops.creer.length} créneaux jusqu'au ${fmtShort(ops.jusqua)}`);
  return [ops.creer.length ? `Semaine type : ${nb(ops.creer.length, 'créneau créé', 'créneaux créés')} automatiquement, jusqu'au ${fmtDate(ops.jusqua)}.` : '',
    ops.feries.length ? `Jours fériés sautés : ${joursListe(ops.feries)}.` : '',
    ops.fermes.length ? `Attention : fermeture exceptionnelle déjà prévue ${plural(ops.fermes.length, 'le', 'les')} ${joursListe(ops.fermes)}, aucun créneau créé ${plural(ops.fermes.length, 'ce jour-là', 'ces jours-là')}.` : ''].filter(Boolean).join('\n');
}

A['sem-voir'] = async (fd, form) => {
  const depuis = fd.get('depuis'), fin = fd.get('finmode') ? fd.get('fin') : '', jours = {};
  if(!depuis) return fieldError(form, 'sem-d', 'Indiquez à partir de quelle date appliquer la semaine type.');
  if(depuis < todayISO()) return fieldError(form, 'sem-d', 'Cette date est déjà passée.');
  for(let i = 1; i <= 7; i++){
    if(!fd.get(`j${i}-on`)) continue;
    const nom = cap1(JOURS[i]), o1 = fd.get(`j${i}-p1`), f1 = fd.get(`j${i}-p1f`), o2 = fd.get(`j${i}-p2`), f2 = fd.get(`j${i}-p2f`), n = parseInt(fd.get(`j${i}-n`), 10);
    if(f1 <= o1) return fieldError(form, `j${i}-p1f`, `${nom} : la fin de la première plage doit être après son début.`);
    const plages = [[o1, f1]];
    if(o2 || f2){
      if(!o2 || !f2) return fieldError(form, `j${i}-${o2 ? 'p2f' : 'p2'}`, `${nom} : indiquez le début et la fin de la deuxième plage, ou laissez les deux vides.`);
      if(f2 <= o2) return fieldError(form, `j${i}-p2f`, `${nom} : la fin de la deuxième plage doit être après son début.`);
      if(o2 < f1 && f2 > o1) return fieldError(form, `j${i}-p2`, `${nom} : les deux plages se chevauchent.`);
      plages.push([o2, f2]); plages.sort((a, b) => a[0].localeCompare(b[0]));
    }
    if(!(n > 0)) return fieldError(form, `j${i}-n`, `${nom} : indiquez le nombre de places par créneau.`);
    jours[i] = {plages, n};
  }
  if(!Object.keys(jours).length) return fieldError(form, 'j1-on', 'Cochez au moins un jour d\'ouverture. Pour arrêter la récurrence, choisissez plutôt une date de fin.');
  if(fd.get('finmode') && !fin) return fieldError(form, 'sem-fin', 'Indiquez le dernier jour de la récurrence.');
  if(fin && fin < depuis) return fieldError(form, 'sem-fin', 'La date de fin doit être après la date de début.');
  loading('Calcul de l\'aperçu…');
  const ancien = paramJSON('semaine', null);
  const sem = {versions: [...(ancien?.versions || []).filter(v => v.depuis < depuis), {depuis, jours}], fin, jusqua: ancien?.jusqua || '', supprimes: ancien?.supprimes || []};
  const lim = addDays(todayISO(), CONFIG.HORIZON), du = sem.jusqua && depuis > addDays(sem.jusqua, 1) ? addDays(sem.jusqua, 1) : depuis;
  const ops = planifier(ctxPlan(sem), du, sem.jusqua > lim ? sem.jusqua : lim, S.plan = await loadPlanning());
  apercu({tab:'semaine', titre:'Aperçu de la semaine type', resas:ops.resas, intro: `<p>À partir du ${esc(fmtDate(depuis))}${fin ? `, jusqu'au ${esc(fmtDate(fin))}` : ', sans date de fin'} :</p>${resumePlan(ops)}`,
    message: fill(tpl('planning').corps, {}), bouton:'Enregistrer la semaine type', boutonPrevenir:'Enregistrer et prévenir les personnes',
    retour: () => adminTab('semaine'),
    faire: async message => {
      const r = await appliquer(ops, message);
      await saveParams({semaine: JSON.stringify({...sem, jusqua: ops.jusqua})});
      await logAction('Semaine type', `À partir du ${fmtShort(depuis)}${fin ? ` jusqu'au ${fmtShort(fin)}` : ''} : ${ops.creer.length} créés, ${ops.suppr.length} supprimés, ${ops.resas.length} réservations annulées`);
      return {m: `Semaine type enregistrée. ${nb(ops.creer.length, 'créneau créé', 'créneaux créés')}${ops.suppr.length ? `, ${nb(ops.suppr.length, 'supprimé', 'supprimés')}` : ''}.${bilanEnvois(r)}`};
    }});
};

A['cg-add'] = async (fd, form) => {
  const du = fd.get('du'), au = fd.get('au'), motif = fd.get('motif').trim();

  const sem = paramJSON('semaine', null), ops = planifier(ctxPlan(sem, conges), du, au, S.plan = await loadPlanning());

    const r = await appliquer({...ops, creer:[], places:[]}, message);
    await saveParams({conges: JSON.stringify(conges)});
    await logAction('Congés', `Du ${fmtShort(du)} au ${fmtShort(au)}${motif ? ' (' + motif + ')' : ''} : ${ops.suppr.length} créneaux supprimés`);

A['cg-del'] = async d => {
  if(!confirm(`Supprimer les congés du ${fmtDate(d.du)} au ${fmtDate(d.au)} ? Les jours de la semaine type seront de nouveau ouverts.`)) return;
  loading();
  const conges = paramJSON('conges', []).filter(c => !(c.du === d.du && c.au === d.au)), sem = paramJSON('semaine', null);
  await saveParams({conges: JSON.stringify(conges)});
  let cree = 0;
  if(sem?.jusqua && d.du <= sem.jusqua){   // on rouvre les jours déjà couverts par la récurrence ; les suivants viendront tout seuls
    const ops = planifier(ctxPlan(sem, conges), d.du, d.au < sem.jusqua ? d.au : sem.jusqua, await loadPlanning());
    await appliquer({...ops, suppr:[], resas:[], places:[]}); cree = ops.creer.length;
  }
  await logAction('Congés supprimés', `Du ${fmtShort(d.du)} au ${fmtShort(d.au)}`);

};

/* ====================== STATISTIQUES ======================
   Chiffres anonymes par mois. Avant chaque nettoyage, le résumé des mois effacés est gardé dans « Paramètres » (clé stats.AAAA-MM). */
function calculerStats(resasToutes, slots, ferms){
  const mois = {};
  const m = k => mois[k] ||= {resas:0, annul:0, places:0, creneaux:0, personnes:0, jours:{}, heures:{}, _p:new Set()};
  for(const s of slots){ if(closedBy(s, ferms)) continue; const x = m(moisDe(s.date)); x.places += s.cap; x.creneaux++; }
  for(const r of resasToutes){
    const x = m(moisDe(r.date));
    if(!r.ok){ x.annul++; continue; }
    x.resas++; x._p.add(r.email.toLowerCase());
    const j = jourSem(r.date); x.jours[j] = (x.jours[j] || 0) + 1; x.heures[r.debut] = (x.heures[r.debut] || 0) + 1;
  }
  for(const x of Object.values(mois)){ x.personnes = x._p.size; delete x._p; }
  return mois;
}
function cumulerStats(list){
  const t = {resas:0, annul:0, places:0, creneaux:0, personnes:0, jours:{}, heures:{}};
  for(const x of list){ for(const k of ['resas','annul','places','creneaux','personnes']) t[k] += x[k] || 0;
    for(const k of ['jours','heures']) for(const [c, v] of Object.entries(x[k] || {})) t[k][c] = (t[k][c] || 0) + v; }
  return t;
}
async function toutesStats(){
  const [r, c, f] = await Promise.all([listAll('reservations'), listAll('creneaux'), listAll('fermetures')]);
  const enLigne = calculerStats(r.map(parseResa).filter(x => x.date), c.map(parseSlot).filter(s => s.date && s.actif), f.map(parseFerm));
  const gardees = {};
  for(const [k, v] of Object.entries(S.params)) if(k.startsWith('stats.')) try{ gardees[k.slice(6)] = JSON.parse(v); }catch{}
  for(const [k, v] of Object.entries(enLigne)) gardees[k] = gardees[k] ? cumulerStats([gardees[k], v]) : v;
  return gardees;
}

/* ====================== ARCHIVES ET NETTOYAGE AUTOMATIQUE ======================
   Toutes les 4 semaines, à la connexion d'un administrateur : les mois entiers terminés depuis plus de 4 semaines
   sont résumés (statistiques anonymes), rangés dans la table « Archives » (texte JSON, découpé si besoin), puis effacés.
   Copie possible dans un dossier de l'ordinateur (Edge ou Chrome), un sous-dossier par année. */
const ARCH = {
  async lister(){
    const parts = (await listAll('archives')).map(r => ({id:r.id, nom:gf(r,'archives','nom') || '', donnees:gf(r,'archives','donnees') || '', cree:r.createdTime}));
    const groupes = new Map();
    for(const p of parts){ const m = p.nom.match(/^(.*?)(?: \(partie (\d+) sur (\d+)\))?$/), base = m[1]; if(!groupes.has(base)) groupes.set(base, {nom:base, parts:[], cree:p.cree}); groupes.get(base).parts.push({...p, n:+(m[2] || 1)}); }
    return [...groupes.values()].map(g => { g.parts.sort((a, b) => a.n - b.n); return g; }).sort((a, b) => b.nom.localeCompare(a.nom));
  },
  contenu: g => JSON.parse(g.parts.map(p => p.donnees).join('')),
  classeur(data){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, feuilleResas(data.reservations || []), 'Réservations');
    const ws = XLSX.utils.json_to_sheet((data.creneaux || []).map(s => ({'Date':fmtShort(s.date), 'Début':s.debut, 'Fin':s.fin, 'Places':s.cap})));
    XLSX.utils.book_append_sheet(wb, ws, 'Créneaux');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((data.fermetures || []).map(f => ({'Date':fmtShort(f.date), 'Horaires':f.journee ? 'Toute la journée' : `${f.debut} à ${f.fin}`, 'Motif':f.motif}))), 'Fermetures');
    return wb;
  },
  fichier: data => `archive-reservations-${data.du}-au-${data.au}.xlsx`,
  /* Dossier choisi sur cet ordinateur : sa « poignée » est gardée dans la base locale du navigateur (IndexedDB). */
  async base(){ return new Promise((ok, ko) => { const r = indexedDB.open('resa-salle', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
  async lire(k){ const db = await this.base(); return new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); },
  async ecrire(k, v){ const db = await this.base(); return new Promise(ok => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = ok; tx.onerror = ok; }); },
  possible: () => 'showDirectoryPicker' in window,
  async dossier(){ try{ return this.possible() ? await this.lire('dossier-archives') : null; }catch{ return null; } },
  /* demander : true seulement après un clic (le navigateur exige un geste de l'utilisateur pour donner l'accès). */
  async copier(groupes, demander){
    const h = await this.dossier(); if(!h) return {fait:0, attente:0};
    let perm = await h.queryPermission({mode:'readwrite'});
    if(perm !== 'granted' && demander) perm = await h.requestPermission({mode:'readwrite'});
    const copiees = store.json('resa-sref-archives-copiees', []), aFaire = groupes.filter(g => !copiees.includes(g.nom));
    if(perm !== 'granted') return {fait:0, attente:aFaire.length};
    for(const g of aFaire){
      const data = this.contenu(g), annee = await h.getDirectoryHandle(data.du.slice(0, 4), {create:true});
      const f = await (await annee.getFileHandle(this.fichier(data), {create:true})).createWritable();
      await f.write(XLSX.write(this.classeur(data), {type:'array', bookType:'xlsx'})); await f.close();
      copiees.push(g.nom);
    }
    store.set('resa-sref-archives-copiees', JSON.stringify(copiees));
    return {fait:aFaire.length, attente:0};
  }
};
/* Les archives sont gardées 12 mois. Pendant leur dernière semaine, une alerte reste affichée sur la page d'accueil de l'administration. */
const finArchive = g => { const d = new Date(g.cree); d.setFullYear(d.getFullYear() + 1); return isoOf(d); };
async function expirerArchives(){
  S.alertes = [];
  if(!archivesOk()) return '';
  const t = todayISO(), groupes = await ARCH.lister(), perimees = groupes.filter(g => finArchive(g) <= t);
  S.alertes = groupes.filter(g => finArchive(g) > t && ecart(t, finArchive(g)) <= 7).map(g => ({nom: g.nom, fin: finArchive(g)}));
  if(!perimees.length) return '';
  await deleteRecs('archives', perimees.flatMap(g => g.parts.map(p => p.id)));
  for(const g of perimees) await logAction('Archive effacée au bout de 12 mois', g.nom);
  return `${nb(perimees.length, 'archive a été effacée', 'archives ont été effacées')} au bout de 12 mois : ${listeFr(perimees.map(g => `« ${g.nom} »`))}.`;
}
const alertesArchives = () => S.alertes.length ? msg('att', S.alertes.map(a => `Attention : l'archive « ${a.nom} » sera effacée définitivement le ${fmtDate(a.fin)}, au bout de 12 mois de conservation. Pour la garder, téléchargez-la avant dans Exports et archives, « Archives ».`).join('\n')) : '';
async function nettoyer(){
  if(!parametresOk() || !archivesOk()) return '';
  const t = todayISO(), dernier = param('nettoyage.dernier', '');
  if(dernier && ecart(dernier, t) < CONFIG.NETTOYAGE) return '';
  await saveParams({'nettoyage.dernier': t});   // posé d'abord : deux administrateurs connectés en même temps ne nettoient pas deux fois
  const limite = moisDe(addDays(t, -CONFIG.NETTOYAGE)) + '-01';   // on efface des mois entiers, pour que les statistiques restent exactes
  const [r, c, f, j] = await Promise.all([listAll('reservations'), listAll('creneaux'), listAll('fermetures'), listAll('journal')]);
  const vieux = (recs, parse) => recs.map(x => ({rec:x, o:parse(x)})).filter(x => x.o.date && x.o.date < limite);
  const vr = vieux(r, parseResa), vc = vieux(c, parseSlot), vf = vieux(f, parseFerm);
  const unAn = new Date(); unAn.setFullYear(unAn.getFullYear() - 1);
  const vj = j.filter(x => new Date(x.createdTime) < unAn);
  let note = '';
  if(vr.length || vc.length || vf.length){
    const toutes = [...vr, ...vc, ...vf].map(x => x.o.date).sort(), du = toutes[0], au = addDays(limite, -1);
    // 1. statistiques anonymes des mois effacés
    const st = calculerStats(vr.map(x => x.o), vc.map(x => x.o).filter(s => s.actif), vf.map(x => x.o)), cles = {};
    for(const [m, v] of Object.entries(st)){ const deja = paramJSON('stats.' + m, null); cles['stats.' + m] = JSON.stringify(deja ? cumulerStats([deja, v]) : v); }
    if(Object.keys(cles).length) await saveParams(cles);
    // 2. archive
    const data = JSON.stringify({du, au, reservations: vr.map(x => ({date:x.o.date, debut:x.o.debut, fin:x.o.fin, nom:x.o.nom, prenom:x.o.prenom, email:x.o.email, statut:x.o.statutRaw})),
      creneaux: vc.map(x => ({date:x.o.date, debut:x.o.debut, fin:x.o.fin, cap:x.o.cap})), fermetures: vf.map(x => ({date:x.o.date, debut:x.o.debut, fin:x.o.fin, journee:x.o.journee, motif:x.o.motif}))});
    const nom = `Archive du ${fmtShort(du)} au ${fmtShort(au)}`, n = Math.ceil(data.length / CONFIG.TAILLE_ARCHIVE);
    await createRecs('archives', Array.from({length:n}, (_, i) => ({nom: n > 1 ? `${nom} (partie ${i + 1} sur ${n})` : nom, donnees: data.slice(i * CONFIG.TAILLE_ARCHIVE, (i + 1) * CONFIG.TAILLE_ARCHIVE)})));
    // 3. effacement, seulement une fois l'archive enregistrée
    await deleteRecs('reservations', vr.map(x => x.rec.id)); await deleteRecs('creneaux', vc.map(x => x.rec.id)); await deleteRecs('fermetures', vf.map(x => x.rec.id));
    note = `Nettoyage automatique : ${nb(vr.length, 'réservation archivée', 'réservations archivées')} (du ${fmtDate(du)} au ${fmtDate(au)}), dans Exports et archives, « Archives ».`;
    try{ const cp = await ARCH.copier(await ARCH.lister(), false);
      if(cp.fait) note += ` Copie enregistrée dans votre dossier d'archives.`;
      else if(cp.attente) note += ` Pour la copier dans votre dossier, ouvrez « Archives » et cliquez sur « Copier les archives dans le dossier ».`; }catch{}
    await logAction('Nettoyage automatique', `${vr.length} réservations, ${vc.length} créneaux, ${vf.length} fermetures archivés (${fmtShort(du)} au ${fmtShort(au)})`);
  }
  if(vj.length) await deleteRecs('journal', vj.map(x => x.id));
  return note;
}
PAGES.archives = async () => {
  if(!archivesOk()) return `<p class="msg info">Pour activer les archives et le nettoyage automatique, créez dans Airtable une table « Archives » avec deux colonnes : « Nom » (texte sur une ligne) et « Données » (texte long). Rechargez ensuite le site.</p>${parametresOk() ? '' : besoinParametres()}`;
  await loadParams();
  const groupes = S.archives = await ARCH.lister(), dernier = param('nettoyage.dernier', ''), h = await ARCH.dossier();

  return `<div class="compteur ${niveau[0]}"><div class="compteur-haut"><h3 id="cpt-titre" style="margin:0">E-mails envoyés en ${esc(fmtMois(moisDe(todayISO())))}</h3>

/* ====================== JEAN-JACQUES ======================
   Œuf de Pâques réservé à l'espace administrateur.
   La plaque dévoile un indice ; le mot « jeanjacques » tapé hors d'un champ lance la cérémonie. */
const JJ = {
  PHRASE: 'Jean-Jacques ne courait pas après la gloire : il l\'attendait sur sa branche. Elle est venue en drakkar.',
  PLAQUE: 'Ici reposait Jean-Jacques, phasme. Il ne faisait rien, mais il le faisait avec une distinction qui force le respect.',
  INDICE: 'Paraît qu\'il répond encore quand on l\'appelle par son nom. Encore faut-il savoir taper.',
  tape: '', enCours: false,
  plaque(){
    return `<div class="jj"><button type="button" class="jj-btn" data-act="jj" aria-expanded="false" aria-controls="jj-plaque">En mémoire de Jean-Jacques</button>
      <div id="jj-plaque" class="jj-plaque" hidden><p>${esc(this.PLAQUE)}</p><p class="jj-indice">${esc(this.INDICE)}</p></div></div>`;
  },
  scene(){
    const flammes = [[100,58,40],[125,40,58],[150,50,48],[178,34,64],[205,48,50],[232,56,42],[255,64,34]].map(([x,y,h]) =>
      `<path class="jj-flamme" d="M${x-9} ${y+h} Q${x-11} ${y+h/2} ${x} ${y} Q${x+11} ${y+h/2} ${x+9} ${y+h} Z" fill="#ff7a12" stroke="#ffd23f" stroke-width="3"/>`).join('');
    return `<div class="jj-scene"><svg class="jj-bateau" viewBox="0 0 340 170" aria-hidden="true"><g class="jj-houle">
      <rect x="166" y="14" width="5" height="90" fill="#5a3a1c"/>
      <path d="M171 18 L232 30 L232 88 L171 96 Z" fill="#c8102e"/><path d="M171 40 L232 46 M171 62 L232 64 M171 84 L232 82" stroke="#f3e9d2" stroke-width="7"/>
      ${flammes}
      <g stroke="#8fbf3a" stroke-width="4" stroke-linecap="round" fill="none"><path d="M110 92 L200 92"/><path d="M200 92 L214 80"/><path d="M122 92 L112 80 M140 92 L136 78 M160 92 L166 78 M180 92 L188 80 M128 92 L120 99 M172 92 L180 99"/><path d="M214 80 L232 68 M214 80 L236 76"/></g>
      <path d="M20 96 Q40 92 60 100 L280 100 Q300 92 322 96 Q300 140 250 146 L90 146 Q40 140 20 96 Z" fill="#7a4a22" stroke="#4a2c12" stroke-width="3"/>
      <path d="M20 96 Q8 80 14 62 Q24 70 30 90 Z M322 96 Q334 80 328 62 Q318 70 312 90 Z" fill="#7a4a22" stroke="#4a2c12" stroke-width="3"/>
      ${[70,110,150,190,230,270].map(x => `<circle cx="${x}" cy="114" r="10" fill="#d9b44a" stroke="#4a2c12" stroke-width="2"/>`).join('')}
      <path d="M0 150 Q42 138 85 150 T170 150 T255 150 T340 150 L340 170 L0 170 Z" fill="#2c5f8a" opacity=".9"/></g></svg>
      <p class="jj-texte">${esc(this.PHRASE)}</p></div>`;
  },
  son(){
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ac = new AC(), t0 = ac.currentTime, D = 10;
    const sortie = ac.createGain(); sortie.gain.setValueAtTime(0, t0); sortie.gain.linearRampToValueAtTime(.6, t0 + .8);
    sortie.gain.setValueAtTime(.6, t0 + D - 1.5); sortie.gain.linearRampToValueAtTime(0, t0 + D); sortie.connect(ac.destination);
    const bruit = ac.createBuffer(1, ac.sampleRate * D, ac.sampleRate), b = bruit.getChannelData(0);
    for(let i = 0; i < b.length; i++) b[i] = Math.random() * 2 - 1;
    // Vagues : bruit grave dont le volume monte et descend lentement
    const vague = ac.createBufferSource(); vague.buffer = bruit;
    const filtreV = ac.createBiquadFilter(); filtreV.type = 'lowpass'; filtreV.frequency.value = 500;
    const gV = ac.createGain(); gV.gain.value = .25; const lfo = ac.createOscillator(); lfo.frequency.value = .18;
    const gL = ac.createGain(); gL.gain.value = .2; lfo.connect(gL).connect(gV.gain);
    vague.connect(filtreV).connect(gV).connect(sortie); vague.start(t0); lfo.start(t0); vague.stop(t0 + D); lfo.stop(t0 + D);
    // Feu : petits craquements aigus au hasard
    const feu = ac.createBufferSource(); feu.buffer = bruit; const filtreF = ac.createBiquadFilter(); filtreF.type = 'highpass'; filtreF.frequency.value = 2500;
    const gF = ac.createGain(); gF.gain.setValueAtTime(0, t0);
    for(let t = .5; t < D - .5; t += .05 + Math.random() * .25){ gF.gain.setValueAtTime(.35 * Math.random(), t0 + t); gF.gain.setValueAtTime(0, t0 + t + .015); }
    feu.connect(filtreF).connect(gF).connect(sortie); feu.start(t0); feu.stop(t0 + D);
    // Cor viking : deux longues notes graves, en quinte
    [[1, 2.2], [3.8, 3.2]].forEach(([debut, duree]) => {
      const gC = ac.createGain(), filtreC = ac.createBiquadFilter(); filtreC.type = 'lowpass'; filtreC.frequency.value = 900;
      gC.gain.setValueAtTime(0, t0 + debut); gC.gain.linearRampToValueAtTime(.22, t0 + debut + .35);
      gC.gain.setValueAtTime(.22, t0 + debut + duree - .5); gC.gain.linearRampToValueAtTime(0, t0 + debut + duree);
      filtreC.connect(gC).connect(sortie);
      [98, 147].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(f * .94, t0 + debut); o.frequency.linearRampToValueAtTime(f, t0 + debut + .3);
        o.connect(filtreC); o.start(t0 + debut); o.stop(t0 + debut + duree); });
    });
    setTimeout(() => ac.close(), (D + .5) * 1000);
  },
  ceremonie(){
    if(this.enCours) return; this.enCours = true;
    document.body.insertAdjacentHTML('beforeend', this.scene());
    try{ this.son(); }catch{}
    setTimeout(() => announce(this.PHRASE), 1200);
    setTimeout(() => { document.querySelector('.jj-scene')?.remove(); this.enCours = false; }, 10200);
  }
};

  if(!S.admin || e.ctrlKey || e.altKey || e.metaKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
  if(e.key.length !== 1) return;
  JJ.tape = (JJ.tape + e.key.toLowerCase()).replace(/[^a-z]/g, '').slice(-11);
  if(JJ.tape === 'jeanjacques'){ JJ.tape = ''; JJ.ceremonie(); }
});


/* ====================== SONS DISCRETS ======================
   Synthétisés par le navigateur, sans fichier. Le bouton de l'en-tête les coupe ou les remet ; le choix est mémorisé. */
const SON = {
  actif: store.get('resa-sons') !== 'non',
  ac: null,
  ctx(){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
    if(!this.ac) this.ac = new AC(); if(this.ac.state === 'suspended') this.ac.resume(); return this.ac; },
  note(f, debut, duree, vol = .12, type = 'sine'){
    const ac = this.ctx(); if(!ac) return; const t = ac.currentTime + debut;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + duree);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + duree + .05);
  },
  jouer(fn){ if(!this.actif) return; try{ fn(); }catch{} },
  ok(){ this.jouer(() => { this.note(1046.5, 0, .5, .09); this.note(1318.5, .09, .6, .08); this.note(1568, .18, .8, .06); }); },   // petit carillon montant
  annul(){ this.jouer(() => { this.note(784, 0, .35, .08, 'triangle'); this.note(587.3, .12, .5, .07, 'triangle'); }); },      // deux notes qui descendent
  err(){ this.jouer(() => { this.note(220, 0, .22, .07, 'triangle'); this.note(196, .1, .28, .06, 'triangle'); }); },          // son grave et doux
  clic(){ this.jouer(() => this.note(1800, 0, .05, .035, 'triangle')); },                                                      // tic très bref
  /* Le libellé dit l'état en clair (« activés » ou « désactivés ») : pas besoin d'état « enfoncé » en plus pour NVDA. */
  majBouton(){ const b = document.getElementById('son-btn'); if(!b) return;
    b.classList.toggle('coupe', !this.actif); b.querySelector('span').textContent = `Sons du site ${this.actif ? 'activés' : 'désactivés'}`; }
};
document.getElementById('son-btn').addEventListener('click', () => {
  SON.actif = !SON.actif; store.set('resa-sons', SON.actif ? 'oui' : 'non');
  SON.majBouton(); announce(SON.actif ? 'Sons du site activés.' : 'Sons du site désactivés.'); if(SON.actif) SON.clic();
});
SON.majBouton();

/* ====================== DÉMARRAGE ====================== */
(async () => {
  try{
    if(typeof emailjs !== 'undefined') emailjs.init({publicKey: CONFIG.EMAILJS_PUBLIC_KEY});
    loading('Chargement…');
    await loadSchema();
    await loadParams().catch(() => {});
    const missing = Object.values(SCHEMA).filter(v => v.absent.length && !v.optional);
    if(missing.length){
      show(card(`<h2>Configuration Airtable incomplète</h2>${msg('err','Certaines tables ou colonnes sont introuvables.')}<ul>${missing.map(v => `<li>${esc(v.label)} : ${v.missingTable ? 'table introuvable' : 'colonnes manquantes : ' + esc(v.absent.join(', '))}</li>`).join('')}</ul>`));
      return;
    }
    const q = new URLSearchParams(location.search), tok = q.get('annuler'), serie = q.get('serie');
    if(tok || serie) history.replaceState(null, '', location.pathname);
    await run(() => tok || serie ? cancelByLink(tok, serie) : home());
  }catch(e){
    const s = e.status;
    show(card(`<h2>Connexion à la base impossible</h2>${msg('err', s === 403 ? 'Le jeton Airtable doit aussi avoir la permission « schema.bases:read » (lecture de la structure). Ouvrez le jeton dans Airtable et ajoutez cette permission.'
      : s === 401 ? 'Le jeton Airtable est invalide ou a été supprimé.' : s === 404 ? 'Base Airtable introuvable : vérifiez son identifiant.' : 'Erreur : ' + e.message)}
      <div class="actions"><button type="button" class="btn" onclick="location.reload()">Réessayer</button></div>`));
  }
})();
</script>
